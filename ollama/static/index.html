<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>AINet</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" />
  <style>
    :root {
      --bg: #f3f4f1;
      --bg-elev: #ffffff;
      --ink: #121412;
      --muted: #6a726c;
      --line: #e2e6e1;
      --line-strong: #cfd6cf;
      --accent: #0c8f55;
      --accent-soft: rgba(12, 143, 85, 0.10);
      --user: #121412;
      --danger: #c2472c;
      --ok: #0c8f55;
      --warn: #b7791f;
      --tool: #3d6b8f;
      --radius: 14px;
      --shadow: 0 1px 0 rgba(18, 20, 18, 0.04), 0 10px 30px rgba(18, 20, 18, 0.04);
      --shadow-card:
        0 1px 1px rgba(18, 20, 18, 0.03),
        0 4px 12px rgba(18, 20, 18, 0.06),
        0 14px 32px rgba(18, 20, 18, 0.07);
      --shadow-card-hover:
        0 2px 4px rgba(18, 20, 18, 0.04),
        0 10px 24px rgba(18, 20, 18, 0.09),
        0 24px 48px rgba(18, 20, 18, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Figtree", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #eef1ec 0%, var(--bg) 40%, #ebeee9 100%);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      max-width: 1480px;
      height: 100%;
      margin: 0 auto;
      padding: 1rem 1rem 0.85rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.75rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.15rem 0.1rem 0.85rem;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .brand em {
      font-style: normal;
      color: var(--accent);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }

    button, select {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink);
      background: var(--bg-elev);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover, select:hover { border-color: #9aa89f; }
    button:disabled { opacity: 0.45; cursor: wait; }
    #soi {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }
    #soi:hover { background: #0a7a48; }
    #soi-phase2 {
      font-weight: 600;
      border-color: #c8d6e6;
      color: #1f3a5f;
    }
    #soi-phase2:hover { background: #eef3f8; border-color: #7a97b8; }
    #soi-phase2:disabled { opacity: 0.45; cursor: wait; }
    #hard-reset {
      font-weight: 600;
      border-color: #e4c4bb;
      color: #8a3324;
    }
    #hard-reset:hover { background: #f8ece8; border-color: #c2472c; }
    #spotify-btn {
      font-weight: 600;
      border-color: #c8e6d4;
      color: #0a4f32;
    }
    #spotify-btn:hover { background: #e8f5ee; border-color: #0c8f55; }
    #spotify-btn.linked {
      background: #e8f5ee;
      border-color: #0c8f55;
      color: #0a4f32;
    }
    #spotify-btn.needs-setup {
      border-color: #e4d4bb;
      color: #8a5a24;
    }

    .meta {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }
    .meta strong { color: var(--ink); font-weight: 600; }
    #soi-state {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.68rem;
      font-weight: 600;
    }
    #soi-state::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #b0bab3;
    }
    #soi-state.on { color: var(--ok); }
    #soi-state.on::before {
      background: var(--ok);
      box-shadow: 0 0 0 0 rgba(12, 143, 85, 0.45);
      animation: pulse 1.3s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(12, 143, 85, 0.4); }
      100% { box-shadow: 0 0 0 8px rgba(12, 143, 85, 0); }
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 232px minmax(0, 1.15fr) minmax(340px, 0.85fr);
      gap: 0.75rem;
      transition: grid-template-columns 280ms cubic-bezier(0.2, 0.85, 0.2, 1);
    }
    .workspace.side-collapsed {
      grid-template-columns: 232px minmax(0, 1fr) 44px;
      gap: 0.55rem;
    }
    .workspace.chats-collapsed {
      grid-template-columns: 44px minmax(0, 1.15fr) minmax(340px, 0.85fr);
    }
    .workspace.chats-collapsed.side-collapsed {
      grid-template-columns: 44px minmax(0, 1fr) 44px;
    }
    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 200px minmax(0, 1fr) minmax(300px, 0.8fr);
      }
    }
    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) minmax(260px, 40vh);
      }
      .workspace.side-collapsed,
      .workspace.chats-collapsed,
      .workspace.chats-collapsed.side-collapsed {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) 44px;
      }
    }

    .chat-pane, .soi-panel, .chats-rail {
      min-height: 0;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chats-rail {
      min-width: 0;
    }
    .chats-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      padding: 0.7rem 0.7rem 0.55rem;
      border-bottom: 1px solid var(--line);
    }
    .chats-head strong {
      font-family: "Syne", sans-serif;
      font-size: 0.92rem;
      letter-spacing: -0.02em;
    }
    .chats-head-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    #chats-new {
      padding: 0.28rem 0.65rem;
      font-size: 0.72rem;
    }
    .chats-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
    }
    .chat-item {
      text-align: left;
      width: 100%;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      padding: 0.55rem 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }
    .chat-item:hover {
      background: #f4f6f3;
      border-color: var(--line);
    }
    .chat-item.active {
      background: var(--accent-soft);
      border-color: #c8e6d4;
    }
    .chat-item-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .chat-item-meta {
      font-size: 0.68rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .chats-empty {
      padding: 0.85rem 0.65rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .workspace.chats-collapsed .chats-head-actions #chats-new,
    .workspace.chats-collapsed .chats-list,
    .workspace.chats-collapsed .chats-head strong {
      display: none !important;
    }
    .workspace.chats-collapsed .chats-head {
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0.85rem;
      padding: 0.65rem 0.25rem;
      border-bottom: none;
    }
    .chats-collapsed-label {
      display: none;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: "Syne", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      user-select: none;
    }
    .workspace.chats-collapsed .chats-collapsed-label {
      display: block;
    }
    .soi-panel {
      position: relative;
      transition: box-shadow 220ms ease;
    }
    .workspace.side-collapsed .soi-panel {
      cursor: pointer;
    }
    .workspace.side-collapsed .soi-panel:hover {
      box-shadow: var(--shadow-card-hover);
    }
    .workspace.side-collapsed .soi-body,
    .workspace.side-collapsed .soi-view,
    .workspace.side-collapsed #soi-state,
    .workspace.side-collapsed #side-label,
    .workspace.side-collapsed .soi-head-left {
      display: none !important;
    }
    .workspace.side-collapsed .soi-head {
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0.85rem;
      padding: 0.65rem 0.25rem;
      border-bottom: none;
    }
    .workspace.side-collapsed .soi-head-right {
      flex-direction: column;
    }
    .side-toggle {
      flex-shrink: 0;
      width: 1.85rem;
      height: 1.85rem;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
    }
    .side-toggle:hover {
      border-color: var(--line-strong);
      background: #f3f5f1;
    }
    .workspace.side-collapsed .side-toggle {
      margin-top: 0.15rem;
    }
    .side-collapsed-label {
      display: none;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: "Syne", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      user-select: none;
    }
    .workspace.side-collapsed .side-collapsed-label {
      display: block;
    }

    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.1rem 1.15rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: min(92%, 680px);
      animation: rise 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .msg.user { align-self: flex-end; }
    .msg.bot, .msg.sys { align-self: flex-start; }
    .msg.sys { align-self: center; max-width: 100%; }
    .msg.has-wide-plot {
      max-width: 100%;
      width: 100%;
      align-self: stretch;
    }

    .msg-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.35rem 0.15rem;
    }
    .msg.user .msg-label { text-align: right; margin-right: 0.15rem; }

    .msg-body {
      padding: 0.85rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      line-height: 1.55;
      font-size: 0.96rem;
      word-break: break-word;
    }
    .msg-body.plain { white-space: pre-wrap; }
    .msg.user .msg-body {
      background: var(--user);
      color: #f5f7f4;
      border-color: transparent;
      white-space: pre-wrap;
    }
    .msg.bot .msg-body {
      background: #fafbf9;
      border-color: var(--line);
    }
    .msg.sys .msg-body {
      background: transparent;
      border-style: dashed;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.45rem 0.75rem;
      text-align: center;
      white-space: pre-wrap;
    }
    .msg.error .msg-body {
      color: var(--danger);
      border-color: rgba(194, 71, 44, 0.35);
      background: rgba(194, 71, 44, 0.05);
      white-space: pre-wrap;
    }

    /* Markdown / math */
    .msg-body.md {
      white-space: normal;
    }
    .msg-body.md > :first-child { margin-top: 0; }
    .msg-body.md > :last-child { margin-bottom: 0; }
    .msg-body.md p { margin: 0.55rem 0; }
    .msg-body.md h1,
    .msg-body.md h2,
    .msg-body.md h3,
    .msg-body.md h4 {
      margin: 0.9rem 0 0.4rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .msg-body.md h1 { font-size: 1.25rem; }
    .msg-body.md h2 { font-size: 1.12rem; }
    .msg-body.md h3 { font-size: 1.02rem; }
    .msg-body.md ul,
    .msg-body.md ol {
      margin: 0.45rem 0;
      padding-left: 1.25rem;
    }
    .msg-body.md li { margin: 0.2rem 0; }
    .msg-body.md blockquote {
      margin: 0.65rem 0;
      padding: 0.35rem 0.75rem;
      border-left: 3px solid var(--accent);
      color: #3a433e;
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
    }
    .msg-body.md code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.86em;
      background: #eef1ec;
      padding: 0.1em 0.35em;
      border-radius: 5px;
    }
    .msg-body.md pre {
      margin: 0.65rem 0;
      padding: 0.75rem 0.85rem;
      overflow-x: auto;
      background: #121412;
      color: #e8efe9;
      border-radius: 10px;
    }
    .msg-body.md pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      font-size: 0.82rem;
    }
    .msg-body.md table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.65rem 0;
      font-size: 0.9rem;
    }
    .msg-body.md th,
    .msg-body.md td {
      border: 1px solid var(--line-strong);
      padding: 0.4rem 0.55rem;
      text-align: left;
    }
    .msg-body.md th { background: #eef1ec; }
    .msg-body.md a { color: var(--accent); }
    .msg-body.md hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0.85rem 0;
    }
    .msg-body.md .katex-display {
      margin: 0.85rem 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.35rem 0;
    }
    .msg-body.md .katex { font-size: 1.08em; }

    .msg-body.streaming::after {
      content: "";
      display: inline-block;
      width: 0.42em;
      height: 1.05em;
      margin-left: 1px;
      vertical-align: -0.15em;
      background: var(--accent);
      animation: caret 0.9s steps(1) infinite;
    }
    @keyframes caret {
      50% { opacity: 0; }
    }

    .flow {
      display: inline;
      animation: flow-in 320ms ease-out both;
    }
    @keyframes flow-in {
      from { opacity: 0; filter: blur(2px); transform: translateY(0.25em); }
      to { opacity: 1; filter: none; transform: none; }
    }

    .tool-log {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0 0 0.65rem;
    }

    .tool-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.65rem;
      align-items: start;
      padding: 0.8rem 0.95rem;
      border-radius: 16px;
      border: none;
      background: #fff;
      box-shadow: var(--shadow-card);
      font-family: "Figtree", sans-serif;
      font-size: 0.88rem;
      line-height: 1.45;
      animation: tool-in 380ms cubic-bezier(0.2, 0.85, 0.2, 1) both;
    }
    .tool-row.running {
      box-shadow: var(--shadow-card-hover);
    }
    .tool-row.fail {
      background: #fffaf8;
    }

    .tool-dot {
      width: 0.5rem;
      height: 0.5rem;
      margin-top: 0.4rem;
      border-radius: 50%;
      background: #b0bab3;
      flex-shrink: 0;
    }
    .tool-row.running .tool-dot {
      background: transparent;
      border: 1.5px solid var(--accent);
      border-top-color: transparent;
      animation: spin 0.65s linear infinite;
    }
    .tool-row.ok .tool-dot { background: var(--ok); }
    .tool-row.fail .tool-dot { background: var(--danger); }

    .tool-main { min-width: 0; }
    .tool-name {
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
      font-size: 0.92rem;
    }
    .tool-detail {
      margin-top: 0.28rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .tool-status {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: none;
      color: var(--muted);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      background: #f1f3f0;
      align-self: start;
    }
    .tool-row.running .tool-status {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .tool-row.ok .tool-status {
      color: var(--ok);
      background: rgba(12, 143, 85, 0.1);
    }
    .tool-row.fail .tool-status {
      color: var(--danger);
      background: rgba(194, 71, 44, 0.1);
    }

    .img-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
      gap: 0.45rem;
      margin: 0.15rem 0 0.15rem;
    }
    .img-tile {
      display: block;
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 12px;
      background: #e8ebe6;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-card);
    }
    .img-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .img-cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.35rem 0.4rem 0.3rem;
      font-size: 0.65rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(transparent, rgba(18, 20, 18, 0.72));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg.bot .md img {
      max-width: min(100%, 28rem);
      height: auto;
      border-radius: 12px;
      margin: 0.4rem 0;
    }

    .article-cards {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin: 0.1rem 0 0.15rem;
    }
    .article-card {
      display: grid;
      grid-template-columns: 8.4rem 1fr;
      gap: 0.8rem;
      align-items: stretch;
      padding: 0.7rem;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow-card);
      text-decoration: none;
      color: inherit;
      animation: tool-in 380ms cubic-bezier(0.2, 0.85, 0.2, 1) both;
    }
    .article-card.hero {
      grid-template-columns: 1fr;
      padding: 0;
      overflow: hidden;
    }
    .article-card.no-thumb {
      grid-template-columns: 1fr;
    }
    .article-thumb {
      overflow: hidden;
      border-radius: 10px;
      background: #e8ebe6;
      min-height: 5.6rem;
    }
    .article-card.hero .article-thumb {
      border-radius: 0;
      aspect-ratio: 16 / 9;
      min-height: 0;
    }
    .article-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .article-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
    }
    .article-card.hero .article-body {
      padding: 0.85rem 0.95rem 0.95rem;
    }
    .article-kicker {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .article-title {
      font-weight: 600;
      letter-spacing: -0.02em;
      font-size: 0.95rem;
      line-height: 1.3;
    }
    .article-card.hero .article-title {
      font-size: 1.05rem;
    }
    .article-snip {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .plot-card {
      margin: 0.35rem 0 0.55rem;
      padding: 0.55rem 0.55rem 0.35rem;
      border-radius: 18px;
      background:
        linear-gradient(180deg, #ffffff 0%, #f7f8f5 100%);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      animation: tool-in 420ms cubic-bezier(0.2, 0.85, 0.2, 1) both;
    }
    .plot-card.is-3d {
      margin: 0.45rem 0 0.7rem;
      padding: 0.65rem 0.65rem 0.45rem;
    }
    .plot-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.15rem 0.45rem 0.35rem;
      font-family: "Figtree", sans-serif;
    }
    .plot-meta strong {
      font-size: 0.82rem;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .plot-meta span {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: right;
    }
    .plot-host {
      width: 100%;
      min-height: 320px;
    }
    .plot-card.is-3d .plot-host {
      min-height: min(62vh, 640px);
      height: min(62vh, 640px);
    }
    .plot-host .modebar { display: none !important; }
    .plot-host .plotly .main-svg { border-radius: 12px; }

    @keyframes tool-in {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .soi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      background: #fafbf9;
    }
    .soi-head strong {
      color: var(--ink);
      font-weight: 700;
      text-transform: none;
      letter-spacing: -0.02em;
      font-family: "Syne", sans-serif;
      font-size: 0.95rem;
    }
    .soi-head-left { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
    .soi-head-right {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .soi-view {
      display: inline-flex;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elev);
    }
    .soi-view button {
      padding: 0.18rem 0.55rem;
      font-size: 0.64rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: transparent;
      border: none;
      color: var(--muted);
    }
    .soi-view button.on {
      background: var(--ink);
      color: #fff;
      font-weight: 600;
    }
    .soi-view button:hover { border: none; }

    .soi-body { flex: 1; min-height: 0; position: relative; }
    #soi-out, #soi-feed {
      position: absolute;
      inset: 0;
      overflow-y: auto;
    }
    #soi-out {
      margin: 0;
      padding: 0.75rem 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      line-height: 1.45;
      color: #2a332e;
      background: #f7f8f5;
    }
    .soi-panel.view-panel #soi-out { display: none; }
    .soi-panel.view-raw #soi-feed { display: none; }
    .soi-panel.view-doc #soi-out,
    .soi-panel.view-doc #soi-feed { display: none; }
    .soi-panel.view-dev #soi-out,
    .soi-panel.view-dev #soi-feed { display: none; }
    .soi-panel:not(.view-doc) #doc-preview { display: none; }
    .soi-panel:not(.view-dev) #dev-context { display: none; }
    #soi-out:empty::before,
    #soi-feed:empty::before {
      content: "SOI activity will appear here…";
      color: var(--muted);
      font-family: "Figtree", sans-serif;
      font-size: 0.8rem;
    }
    #doc-preview {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 1rem 1.05rem 1.25rem;
      background:
        radial-gradient(120% 80% at 50% -20%, rgba(255, 255, 255, 0.95), transparent 55%),
        #f7f8f5;
    }
    #doc-preview:empty::before {
      content: "Deep Research briefs appear here after save…";
      color: var(--muted);
      font-family: "Figtree", sans-serif;
      font-size: 0.8rem;
    }
    #dev-context {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 0.75rem 0.85rem 1.1rem;
      background: #f7f8f5;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      line-height: 1.45;
      color: #2a332e;
    }
    #dev-context:empty::before {
      content: "Send a message to see the extra context the model gets…";
      color: var(--muted);
      font-family: "Figtree", sans-serif;
      font-size: 0.8rem;
    }
    .dev-meta {
      font-family: "Figtree", sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
    }
    .dev-section {
      margin: 0 0 0.75rem;
      padding: 0.65rem 0.7rem;
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow-card);
    }
    .dev-section h3 {
      margin: 0 0 0.4rem;
      font-family: "Figtree", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .dev-section pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font: inherit;
      color: #1d2620;
    }
    .dev-msg {
      margin: 0 0 0.55rem;
      padding: 0.5rem 0.55rem;
      border-radius: 10px;
      background: #eef1ec;
    }
    .dev-msg:last-child { margin-bottom: 0; }
    .dev-role {
      font-family: "Figtree", sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .dev-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .dev-tools span {
      font-family: "Figtree", sans-serif;
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .doc-meta {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 0.55rem;
    }
    .doc-title {
      font-family: "Syne", sans-serif;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      margin: 0 0 0.65rem;
      line-height: 1.25;
      color: var(--ink);
    }
    .doc-summary {
      font-size: 0.9rem;
      color: #3a453e;
      margin: 0 0 1rem;
      line-height: 1.5;
    }
    .doc-body.md {
      font-size: 0.9rem;
      line-height: 1.55;
      color: #1d2620;
    }
    .doc-body.md h1, .doc-body.md h2, .doc-body.md h3 {
      font-family: "Syne", sans-serif;
      letter-spacing: -0.02em;
      margin: 1.1rem 0 0.45rem;
    }
    .doc-body.md h1 { font-size: 1.15rem; }
    .doc-body.md h2 { font-size: 1.05rem; }
    .doc-body.md h3 { font-size: 0.98rem; }
    .doc-body.md p { margin: 0.45rem 0; }
    .doc-body.md ul, .doc-body.md ol { margin: 0.4rem 0 0.6rem 1.1rem; }
    .doc-body.md .katex-display {
      margin: 0.85rem 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.35rem 0;
    }
    .doc-body.md .katex { font-size: 1.08em; }
    .doc-sources {
      margin-top: 1.15rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
    }
    .doc-sources h3 {
      font-family: "Syne", sans-serif;
      font-size: 0.95rem;
      margin: 0 0 0.5rem;
    }
    .doc-sources ol {
      margin: 0;
      padding-left: 1.15rem;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .doc-sources a { color: #0f6b45; }
    #soi-feed {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 1rem 0.95rem 1.15rem;
      background:
        radial-gradient(120% 80% at 50% -20%, rgba(255, 255, 255, 0.9), transparent 55%),
        #eef1ec;
    }

    .soi-card {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.95rem 1.05rem;
      border: none;
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow-card);
      animation: rise 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .soi-card.pending {
      box-shadow: var(--shadow-card-hover);
    }
    .soi-card.fail, .soi-card.error-ev {
      background: #fffaf8;
      box-shadow:
        0 1px 1px rgba(194, 71, 44, 0.04),
        0 6px 16px rgba(194, 71, 44, 0.07),
        0 14px 32px rgba(18, 20, 18, 0.05);
    }
    .soi-card.phase {
      background: #fff;
    }
    .soi-card-top {
      display: flex;
      justify-content: space-between;
      gap: 0.65rem;
      align-items: center;
    }
    .soi-tool-badge {
      font-family: "Figtree", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .soi-card-status {
      font-size: 0.72rem;
      letter-spacing: 0.01em;
      text-transform: none;
      font-weight: 600;
      color: var(--muted);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      background: #f1f3f0;
      flex-shrink: 0;
    }
    .soi-card.pending .soi-card-status {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .soi-card.pending .soi-card-status::before {
      content: "";
      display: inline-block;
      width: 0.4rem;
      height: 0.4rem;
      margin-right: 0.4rem;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      border-top-color: transparent;
      vertical-align: -1px;
      animation: spin 0.7s linear infinite;
    }
    .soi-card.ok .soi-card-status {
      color: var(--ok);
      background: rgba(12, 143, 85, 0.1);
    }
    .soi-card.fail .soi-card-status {
      color: var(--danger);
      background: rgba(194, 71, 44, 0.1);
    }
    .soi-card-detail {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0;
      background: transparent;
      border: none;
    }
    .soi-card-arg, .soi-card-result, .soi-card-hint, .soi-phase-meta {
      margin: 0;
      font-size: 0.84rem;
      line-height: 1.5;
      color: #4a534d;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "Figtree", sans-serif;
    }
    .soi-card-result {
      margin-top: 0.15rem;
      padding-top: 0.45rem;
      border-top: 1px solid rgba(18, 20, 18, 0.06);
      color: var(--muted);
    }
    .soi-phase-label {
      font-family: "Syne", sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .soi-card.phase .soi-phase-meta {
      color: var(--muted);
      font-size: 0.84rem;
    }
    .tool-file_note, .tool-file_by_id, .tool-log_item { --tool: #0c8f55; }
    .tool-write_json, .tool-create_json, .tool-patch_json, .tool-set_json_path { --tool: #c2472c; }
    .tool-web_search, .tool-web_fetch, .tool-open_chrome, .tool-save_research { --tool: #3d6b8f; }
    .tool-spotify { --tool: #1db954; }
    .tool-read_json, .tool-read_text, .tool-list_dir, .tool-tree { --tool: #5a7d6a; }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: end;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      padding: 0.65rem;
      box-shadow: var(--shadow);
    }
    textarea {
      width: 100%;
      min-height: 3.1rem;
      max-height: 9rem;
      resize: vertical;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: transparent;
      border: none;
      outline: none;
      padding: 0.45rem 0.55rem;
      line-height: 1.45;
    }
    form button[type="submit"] {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      padding: 0.7rem 1.15rem;
      border-radius: 11px;
    }
    form button[type="submit"]:hover { background: #0a7a48; }
    form button#send.stop {
      background: #c2472c;
      border-color: transparent;
    }
    form button#send.stop:hover { background: #a33a24; }
    #soi.stop-soi {
      background: #c2472c;
      border-color: transparent;
    }
    #soi.stop-soi:hover { background: #a33a24; }
    .hint {
      grid-column: 1 / -1;
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0 0.35rem 0.05rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 class="brand">AI<em>Net</em></h1>
        <div class="toolbar">
          <select id="mode" title="Mode"></select>
          <button type="button" id="reset">New session</button>
          <button type="button" id="hard-reset" title="Cancel stuck chat/SOI and start a fresh session">Reset AI</button>
          <button type="button" id="spotify-btn" title="Link Spotify">Spotify</button>
          <button type="button" id="soi">Start SOI</button>
          <button type="button" id="soi-phase2" title="Run SOI Phase 2 Read.json refresh now">Start Phase 2</button>
        </div>
      </div>
      <div class="meta" id="meta">Connecting…</div>
    </header>

    <div class="workspace" id="workspace">
      <aside class="chats-rail" id="chats-rail" aria-label="Past chats">
        <div class="chats-head">
          <strong>Chats</strong>
          <div class="chats-head-actions">
            <button type="button" id="chats-new" title="Start a new chat">New</button>
            <button type="button" id="chats-toggle" class="side-toggle" title="Collapse chats" aria-expanded="true" aria-controls="chats-rail">‹</button>
          </div>
          <span class="chats-collapsed-label" aria-hidden="true">Chats</span>
        </div>
        <div class="chats-list" id="chats-list"></div>
      </aside>
      <section class="chat-pane" aria-label="Chat">
        <div id="log" aria-live="polite"></div>
      </section>
      <aside class="soi-panel view-panel" id="soi-panel" aria-label="SOI and Doc">
        <div class="soi-head">
          <div class="soi-head-left">
            <span id="side-label"><strong>SOI</strong></span>
            <div class="soi-view" role="tablist" aria-label="Right panel view">
              <button type="button" id="soi-view-panel" data-view="panel">SOI</button>
              <button type="button" id="soi-view-raw" data-view="raw">Raw</button>
              <button type="button" id="soi-view-doc" data-view="doc">Doc</button>
              <button type="button" id="soi-view-dev" data-view="dev">Dev</button>
            </div>
          </div>
          <div class="soi-head-right">
            <span id="soi-state">Idle</span>
            <button type="button" id="side-toggle" class="side-toggle" title="Collapse panel" aria-expanded="true" aria-controls="soi-panel">›</button>
          </div>
          <span class="side-collapsed-label" aria-hidden="true">SOI</span>
        </div>
        <div class="soi-body">
          <div id="soi-feed"></div>
          <pre id="soi-out"></pre>
          <div id="doc-preview" aria-label="Research document preview"></div>
          <div id="dev-context" aria-label="Model context inspector"></div>
        </div>
      </aside>
    </div>

    <form id="form">
      <textarea id="input" rows="2" placeholder="Message…" autofocus></textarea>
      <button type="submit" id="send">Send</button>
      <div class="hint">Enter to send · Shift+Enter for newline · Stop cancels chat and SOI · Reset AI unsticks a frozen “…”</div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script>
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const meta = document.getElementById("meta");
    const modeSel = document.getElementById("mode");
    const soiBtn = document.getElementById("soi");
    const soiPhase2Btn = document.getElementById("soi-phase2");
    const soiPanel = document.getElementById("soi-panel");
    const workspace = document.getElementById("workspace");
    const sideToggle = document.getElementById("side-toggle");
    const chatsRail = document.getElementById("chats-rail");
    const chatsList = document.getElementById("chats-list");
    const chatsToggle = document.getElementById("chats-toggle");
    const chatsNew = document.getElementById("chats-new");
    const soiOut = document.getElementById("soi-out");
    const soiFeed = document.getElementById("soi-feed");
    const soiState = document.getElementById("soi-state");
    const soiViewPanel = document.getElementById("soi-view-panel");
    const soiViewRaw = document.getElementById("soi-view-raw");
    const soiViewDoc = document.getElementById("soi-view-doc");
    const soiViewDev = document.getElementById("soi-view-dev");
    const docPreview = document.getElementById("doc-preview");
    const devContext = document.getElementById("dev-context");
    const sideLabel = document.getElementById("side-label");
    let busy = false;
    let chatAbort = null;
    let lastSoiId = 0;
    let soiEs = null;
    let soiStreamOk = false;
    let lastChatEventAt = 0;
    let stallNoticeShown = false;
    const pendingTools = new Map();

    const SIDE_COLLAPSE_KEY = "ainet-side-collapsed";
    function setSideCollapsed(on) {
      const collapsed = !!on;
      if (workspace) workspace.classList.toggle("side-collapsed", collapsed);
      if (soiPanel) soiPanel.classList.toggle("collapsed", collapsed);
      if (sideToggle) {
        sideToggle.textContent = collapsed ? "‹" : "›";
        sideToggle.title = collapsed ? "Expand panel" : "Collapse panel";
        sideToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      }
      try { localStorage.setItem(SIDE_COLLAPSE_KEY, collapsed ? "1" : "0"); } catch (e) {}
      // Charts in chat may need a relayout after the grid width changes.
      window.dispatchEvent(new Event("resize"));
    }
    function toggleSideCollapsed() {
      const now = workspace && workspace.classList.contains("side-collapsed");
      setSideCollapsed(!now);
    }
    try {
      setSideCollapsed(localStorage.getItem(SIDE_COLLAPSE_KEY) === "1");
    } catch (e) {
      setSideCollapsed(false);
    }
    if (sideToggle) sideToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleSideCollapsed();
    });
    if (soiPanel) soiPanel.addEventListener("click", (e) => {
      if (!workspace || !workspace.classList.contains("side-collapsed")) return;
      if (e.target && e.target.closest && e.target.closest("#side-toggle")) return;
      setSideCollapsed(false);
    });

    const CHATS_COLLAPSE_KEY = "ainet-chats-collapsed";
    let currentChatId = "";
    function setChatsCollapsed(on) {
      const collapsed = !!on;
      if (workspace) workspace.classList.toggle("chats-collapsed", collapsed);
      if (chatsToggle) {
        chatsToggle.textContent = collapsed ? "›" : "‹";
        chatsToggle.title = collapsed ? "Expand chats" : "Collapse chats";
        chatsToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      }
      try { localStorage.setItem(CHATS_COLLAPSE_KEY, collapsed ? "1" : "0"); } catch (e) {}
      window.dispatchEvent(new Event("resize"));
    }
    try {
      setChatsCollapsed(localStorage.getItem(CHATS_COLLAPSE_KEY) === "1");
    } catch (e) {
      setChatsCollapsed(false);
    }
    if (chatsToggle) chatsToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const now = workspace && workspace.classList.contains("chats-collapsed");
      setChatsCollapsed(!now);
    });
    if (chatsRail) chatsRail.addEventListener("click", (e) => {
      if (!workspace || !workspace.classList.contains("chats-collapsed")) return;
      if (e.target && e.target.closest && e.target.closest("#chats-toggle")) return;
      setChatsCollapsed(false);
    });

    function chatWhen(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) {
        return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }
      return d.toLocaleDateString([], { month: "short", day: "numeric" });
    }

    function renderChats(rows, sessionId) {
      if (!chatsList) return;
      currentChatId = sessionId || currentChatId;
      chatsList.innerHTML = "";
      if (!rows || !rows.length) {
        const empty = document.createElement("div");
        empty.className = "chats-empty";
        empty.textContent = "No chats yet.";
        chatsList.appendChild(empty);
        return;
      }
      for (const row of rows) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chat-item" + (row.id === currentChatId ? " active" : "");
        btn.dataset.id = row.id;
        const title = document.createElement("span");
        title.className = "chat-item-title";
        title.textContent = row.title || "New chat";
        const meta = document.createElement("span");
        meta.className = "chat-item-meta";
        meta.textContent = chatWhen(row.updated_at);
        btn.appendChild(title);
        btn.appendChild(meta);
        btn.addEventListener("click", () => openChat(row.id));
        chatsList.appendChild(btn);
      }
    }

    async function loadChats() {
      try {
        const r = await fetch("/api/chats");
        const s = await r.json();
        if (s && s.ok) renderChats(s.chats || [], s.session_id || "");
      } catch (e) {}
    }

    function replayChatTurns(turns) {
      logEl.innerHTML = "";
      clearEspTurns();
      if (!turns || !turns.length) {
        addMessage("This chat is empty.", "sys");
        return;
      }
      for (const turn of turns) {
        if (turn.user) addMessage(turn.user, "user");
        if (turn.assistant) {
          const bot = addMessage("", "bot");
          flushLiveMarkdown(bot._body, turn.assistant);
        }
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function openChat(id) {
      if (!id || id === currentChatId || busy) return;
      try {
        const data = await post("/api/chats/open", { id: id }, 5000);
        if (!data || !data.ok) {
          addMessage(asText((data && data.error) || "Could not open chat"), "sys");
          return;
        }
        const chat = data.chat || {};
        currentChatId = chat.id || id;
        replayChatTurns(chat.turns || []);
        renderMeta(data);
        await loadChats();
      } catch (err) {
        addMessage("Could not open chat — " + asText(err), "sys");
      }
    }

    function closeSoiStream() {
      soiStreamOk = false;
      if (soiEs) {
        try { soiEs.close(); } catch (e) {}
        soiEs = null;
      }
    }

    function checkChatWatchdog() {
      if (!busy || !lastChatEventAt || stallNoticeShown) return;
      if (Date.now() - lastChatEventAt < 25000) return;
      stallNoticeShown = true;
      addMessage(
        "No response from the model for 25s. Press Reset AI to start a clean session.",
        "sys"
      );
    }

    function isExternalHttpUrl(href) {
      try {
        const u = new URL(href, window.location.href);
        return u.protocol === "http:" || u.protocol === "https:";
      } catch (e) {
        return false;
      }
    }

    async function openUrlInChrome(href) {
      const url = String(href || "").trim();
      if (!url || !isExternalHttpUrl(url)) return false;
      try {
        const data = await post("/api/open-chrome", { url });
        return !!(data && data.ok);
      } catch (e) {
        return false;
      }
    }

    // pywebview / in-app navigation: force http(s) links into system Chrome.
    document.addEventListener("click", (e) => {
      const a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
      if (!a) return;
      const href = a.getAttribute("href") || "";
      if (!isExternalHttpUrl(href)) return;
      // Keep same-origin app routes (status pages etc.) in-app.
      try {
        const u = new URL(href, window.location.href);
        if (u.origin === window.location.origin) return;
      } catch (err) {}
      e.preventDefault();
      e.stopPropagation();
      openUrlInChrome(href);
    }, true);

    const SOI_VIEW_KEY = "ainet-soi-view";
    function setSoiView(view) {
      const mode =
        view === "raw" ? "raw" :
        view === "doc" ? "doc" :
        view === "dev" ? "dev" : "panel";
      soiPanel.classList.toggle("view-panel", mode === "panel");
      soiPanel.classList.toggle("view-raw", mode === "raw");
      soiPanel.classList.toggle("view-doc", mode === "doc");
      soiPanel.classList.toggle("view-dev", mode === "dev");
      soiViewPanel.classList.toggle("on", mode === "panel");
      soiViewRaw.classList.toggle("on", mode === "raw");
      soiViewDoc.classList.toggle("on", mode === "doc");
      if (soiViewDev) soiViewDev.classList.toggle("on", mode === "dev");
      if (sideLabel) {
        const labels = { doc: "Doc", raw: "Raw", dev: "Dev", panel: "SOI" };
        sideLabel.innerHTML = "<strong>" + (labels[mode] || "SOI") + "</strong>";
      }
      try { localStorage.setItem(SOI_VIEW_KEY, mode); } catch (e) {}
    }
    try { setSoiView(localStorage.getItem(SOI_VIEW_KEY) || "panel"); }
    catch (e) { setSoiView("panel"); }
    soiViewPanel.addEventListener("click", () => setSoiView("panel"));
    soiViewRaw.addEventListener("click", () => setSoiView("raw"));
    soiViewDoc.addEventListener("click", () => setSoiView("doc"));
    if (soiViewDev) soiViewDev.addEventListener("click", () => setSoiView("dev"));

    function renderDevContext(snap) {
      if (!devContext || !snap || typeof snap !== "object") return;
      const bits = [];
      bits.push(
        '<div class="dev-meta">mode <strong>' +
        escapeHtml(snap.mode || "?") +
        "</strong>" +
        (snap.project_root ? " · project " + escapeHtml(String(snap.project_root)) : "") +
        (snap.system_chars != null ? " · system " + snap.system_chars + " chars" : "") +
        "</div>"
      );
      const sections = Array.isArray(snap.sections) ? snap.sections : [];
      for (const sec of sections) {
        if (!sec) continue;
        const id = String(sec.id || "");
        // Mode rules are long — keep them collapsed-looking but readable.
        bits.push(
          '<section class="dev-section" data-id="' + escapeHtml(id) + '">' +
          "<h3>" + escapeHtml(sec.label || id || "Section") + "</h3>" +
          "<pre>" + escapeHtml(sec.text || "") + "</pre>" +
          "</section>"
        );
      }
      const dialogue = Array.isArray(snap.dialogue) ? snap.dialogue : [];
      if (dialogue.length) {
        bits.push('<section class="dev-section"><h3>Dialogue this turn</h3>');
        for (const m of dialogue) {
          const role = String((m && m.role) || "msg");
          let body = String((m && m.content) || "");
          if (m && Array.isArray(m.tool_calls) && m.tool_calls.length) {
            body = (body ? body + "\n" : "") + "[tool_calls: " + m.tool_calls.join(", ") + "]";
          }
          bits.push(
            '<div class="dev-msg"><div class="dev-role">' +
            escapeHtml(role) +
            "</div><pre>" +
            escapeHtml(body || "(empty)") +
            "</pre></div>"
          );
        }
        bits.push("</section>");
      }
      const tools = Array.isArray(snap.tools) ? snap.tools : [];
      if (tools.length) {
        bits.push(
          '<section class="dev-section"><h3>Tools available</h3><div class="dev-tools">' +
          tools.map((t) => "<span>" + escapeHtml(t) + "</span>").join("") +
          "</div></section>"
        );
      }
      if (snap.system) {
        bits.push(
          '<section class="dev-section"><h3>Full system prompt</h3><pre>' +
          escapeHtml(snap.system) +
          "</pre></section>"
        );
      }
      devContext.innerHTML = bits.join("");
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderDocBrief(brief) {
      if (!docPreview) return;
      if (!brief) {
        docPreview.innerHTML = "";
        return;
      }
      const title = escapeHtml(brief.title || "Research brief");
      const summary = escapeHtml(brief.summary || "");
      const when = escapeHtml(brief.created_at || brief.updated_at || "");
      let bodyHtml = "";
      try {
        if (window.marked && window.DOMPurify) {
          // Escape currency so KaTeX won't treat $500 as math.
          const rawBody = String(brief.body || "").replace(/\$(\d[\d,]*(?:\.\d+)?)/g, "\\$$$1");
          const { text: protectedText, chunks } = extractMath(rawBody);
          bodyHtml = DOMPurify.sanitize(
            restoreMathPlaceholders(marked.parse(protectedText, { breaks: true }), chunks),
            { USE_PROFILES: { html: true }, ADD_ATTR: ["target", "rel"] }
          );
        } else {
          bodyHtml = "<pre class='plain'>" + escapeHtml(brief.body || "") + "</pre>";
        }
      } catch (e) {
        bodyHtml = "<pre class='plain'>" + escapeHtml(brief.body || "") + "</pre>";
      }
      const findings = Array.isArray(brief.key_findings) ? brief.key_findings : [];
      let findingsHtml = "";
      if (findings.length) {
        findingsHtml = "<ul>" + findings.map((f) => "<li>" + escapeHtml(f) + "</li>").join("") + "</ul>";
      }
      const sources = Array.isArray(brief.sources) ? brief.sources : [];
      let sourcesHtml = "";
      if (sources.length) {
        sourcesHtml = "<div class='doc-sources'><h3>Sources</h3><ol>" + sources.map((s) => {
          const label = escapeHtml(s.title || s.url || "source");
          const url = escapeHtml(s.url || "");
          const pub = escapeHtml([s.publisher, s.year].filter(Boolean).join(" · "));
          const note = escapeHtml(s.note || "");
          return "<li><a href=\"" + url + "\" target=\"_blank\" rel=\"noopener\">" + label + "</a>"
            + (pub ? " <span style='color:var(--muted)'>(" + pub + ")</span>" : "")
            + (note ? "<div style='color:var(--muted)'>" + note + "</div>" : "")
            + "</li>";
        }).join("") + "</ol></div>";
      }
      docPreview.innerHTML =
        "<div class='doc-meta'>Deep Research" + (when ? " · " + when : "") + "</div>" +
        "<h2 class='doc-title'>" + title + "</h2>" +
        (summary ? "<p class='doc-summary'>" + summary + "</p>" : "") +
        (findingsHtml ? "<div class='doc-body md'><h3>Key findings</h3>" + findingsHtml + "</div>" : "") +
        "<div class='doc-body md'>" + bodyHtml + "</div>" +
        sourcesHtml;
      docPreview.querySelectorAll('a[href^="http"]').forEach((a) => {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      });
      try {
        renderKatex(docPreview);
      } catch (e) {}
    }

    async function loadResearchBrief(opts) {
      opts = opts || {};
      try {
        let url = "/api/research/current";
        if (opts.id || opts.path) {
          const q = new URLSearchParams();
          if (opts.id) q.set("id", opts.id);
          if (opts.path) q.set("path", opts.path);
          url = "/api/research/get?" + q.toString();
        }
        const r = await fetch(url);
        const data = await r.json();
        if (data && data.ok && data.brief) {
          renderDocBrief(data.brief);
          if (opts.activate !== false) setSoiView("doc");
          return data.brief;
        }
      } catch (e) {}
      return null;
    }

    // Prefill Doc pane without stealing focus from SOI.
    loadResearchBrief({ activate: false }).catch(() => {});

    function toolClass(name) {
      return "tool-" + String(name || "tool").replace(/[^a-zA-Z0-9_]/g, "_");
    }

    const TOOL_LABELS = {
      file_note: "File note",
      log_item: "Log item",
      file_by_id: "File by ID",
      write_json: "Write JSON",
      create_json: "Create JSON",
      patch_json: "Update JSON",
      set_json_path: "Set JSON path",
      read_json: "Read JSON",
      read_text: "Read text",
      list_dir: "List folder",
      tree: "Folder tree",
      web_search: "Web search",
      web_fetch: "Open page",
      image_search: "Image search",
      create_plot: "Plot",
      open_chrome: "Open in Chrome",
      spotify: "Spotify",
      save_research: "Save research",
      inspect_research: "Inspect research",
      create_cop: "Create content",
      create_project: "Create project",
      list_projects: "List projects",
      open_project: "Open project",
      close_project: "Close project",
      write_text: "Write text",
      create_folder: "Create folder",
      move_path: "Rename / move",
    };

    const ARG_LABELS = {
      path: "Path",
      dest: "Destination",
      query: "Search",
      action: "Action",
      uri: "URI",
      volume: "Volume",
      url: "Link",
      entry_id: "Entry",
      entry_ids: "Entries",
      title: "Title",
      slug: "Slug",
      folder_path: "Folder",
      note: "Note",
      text: "Text",
      field: "Field",
      summary: "Summary",
      kind: "Type",
    };

    function titleWords(s) {
      return String(s || "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function toolLabel(name) {
      const key = String(name || "tool");
      if (TOOL_LABELS[key]) return TOOL_LABELS[key];
      return titleWords(key) || "Tool";
    }

    function statusLabel(kind) {
      if (kind === "running") return "Working";
      if (kind === "ok") return "Done";
      if (kind === "fail") return "Failed";
      return titleWords(kind);
    }

    function prettyValue(val) {
      if (val == null) return "";
      if (Array.isArray(val)) return val.map(prettyValue).filter(Boolean).join(", ");
      let s = String(val).trim();
      if ((s.startsWith("'") && s.endsWith("'")) || (s.startsWith('"') && s.endsWith('"'))) {
        s = s.slice(1, -1);
      }
      if (/^discard$/i.test(s)) return "Discard";
      if (/^[a-z]+(?:_[a-z0-9]+)+$/i.test(s) && s.length < 48) return titleWords(s);
      if (s.length > 140) return s.slice(0, 140) + "…";
      return s;
    }

    function argLabel(key) {
      if (ARG_LABELS[key]) return ARG_LABELS[key];
      return titleWords(key);
    }

    function formatArgPair(key, val) {
      const nice = prettyValue(val);
      if (!nice) return "";
      return argLabel(key) + " · " + nice;
    }

    function parseHintString(hint) {
      let s = String(hint || "").trim();
      if (!s) return "";
      s = s.replace(/^\s+/, "");
      const m = s.match(/^([a-zA-Z_][\w]*)\s*=\s*(.+)$/);
      if (m) return formatArgPair(m[1], m[2]);
      if (s.startsWith("{") || s.startsWith("[")) {
        try {
          const obj = JSON.parse(s);
          if (obj && typeof obj === "object" && !Array.isArray(obj)) {
            for (const key of Object.keys(ARG_LABELS)) {
              if (obj[key] == null || obj[key] === "") continue;
              return formatArgPair(key, obj[key]);
            }
          }
        } catch (e) {}
      }
      return prettyValue(s);
    }

    function formatArgsObject(args) {
      if (!args || typeof args !== "object") return "";
      const preferred = [
        "title", "dest", "path", "folder_path", "query", "url",
        "entry_id", "entry_ids", "slug", "note", "text", "kind", "summary",
      ];
      for (const key of preferred) {
        if (args[key] == null || args[key] === "") continue;
        // Skip huge blobs on the tool card.
        if (key === "body" || key === "sources" || key === "key_findings") continue;
        return formatArgPair(key, args[key]);
      }
      for (const key of Object.keys(args)) {
        if (args[key] == null || args[key] === "") continue;
        if (key === "body" || key === "sources" || key === "key_findings" || key === "data") continue;
        return formatArgPair(key, args[key]);
      }
      return "";
    }

    function prettySummary(text) {
      let s = String(text || "").trim();
      if (!s) return "";
      s = s.replace(/^\(SOI\s+/i, "").replace(/\)$/, "");
      s = s.replace(/\b([a-z]+(?:_[a-z0-9]+)+)\b/g, (_, w) => titleWords(w));
      s = s.replace(/\s*=\s*/g, ": ");
      s = s.replace(/['"]/g, "");
      if (s.length > 180) s = s.slice(0, 180) + "…";
      return s;
    }

    function prettyPhaseMeta(text) {
      let s = String(text || "").trim();
      if (!s) return "";
      s = s.replace(/^\(SOI\s+/i, "").replace(/\)$/, "");
      s = s.replace(/^watcher on:\s*/i, "");
      s = s.replace(/^wake:\s*/i, "");
      s = s.replace(/^filing\.\.\.\s*/i, "");
      s = s.replace(/^filing done:\s*/i, "");
      s = s.replace(/^backing off\s*/i, "Waiting ");
      s = s.replace(/\bfile@([\d.]+)s/gi, "file idle $1s");
      s = s.replace(/\bread@([\d.]+)s/gi, "read idle $1s");
      s = s.replace(/\btimeout@([\d.]+)s/gi, "timeout $1s");
      s = s.replace(/\bphase=(\S+)/gi, (_, p) => "phase " + titleWords(p));
      s = s.replace(/\bidle=([\d.]+)s/gi, "idle $1s");
      s = s.replace(/\bchangelog=(\d+)/gi, "$1 changelog");
      s = s.replace(/\binbox=(\d+)/gi, "$1 inbox");
      s = s.replace(/\bfiled=(\d+)/gi, "filed $1");
      s = s.replace(/\bdiscarded=(\d+)/gi, "discarded $1");
      s = s.replace(/\bpending=(\d+)/gi, "pending $1");
      s = s.replace(/--+/g, "·");
      s = s.replace(/\s+/g, " ").trim();
      return s;
    }

    function hintFromRow(row) {
      const args = row && row.arguments;
      const fromArgs = formatArgsObject(args);
      if (fromArgs) return fromArgs;
      if (row && row.hint) {
        const h = parseHintString(row.hint);
        if (h) return h;
      }
      if (row && row.summary) return prettySummary(row.summary);
      if (row && row.preview) return prettySummary(row.preview);
      return "";
    }

    function parseSoiRow(row) {
      if (row && typeof row === "object" && row.event) return row;
      const text = lineText(row);
      let m = text.match(/^\(SOI tool -> (\S+)(.*)\)$/);
      if (m) return { event: "tool_start", name: m[1], hint: m[2] || "", text };
      m = text.match(/^\(SOI tool (ok|FAIL) (\S+): (.*)\)$/);
      if (m) return { event: "tool_done", ok: m[1] === "ok", name: m[2], summary: m[3], text };
      m = text.match(/^\(SOI wake: phase=(\S+)/);
      if (m) return { event: "idle_wake", phase: m[1], text };
      if (text.startsWith("(SOI filing...")) return { event: "filing_start", text };
      if (text.startsWith("(SOI filing done")) return { event: "filing_done", text };
      if (text.startsWith("(SOI Read refresh...")) return { event: "read_refresh_start", text };
      if (text.startsWith("(SOI Read refresh done")) return { event: "read_refresh_done", text };
      if (text.startsWith("(SOI model ask")) return { event: "model_ask", text };
      if (text.startsWith("(SOI model reply")) return { event: "model_reply", text };
      if (/error|FAIL|failed/i.test(text)) return { event: "error", text, level: "error" };
      return { event: "log", text };
    }

    function phaseCopy(row) {
      const ev = row.event;
      if (ev === "idle_wake") return { title: row.phase === "read_refresh" ? "Read refresh" : "Filing wake", meta: row.text };
      if (ev === "filing_start") return { title: "Filing", meta: row.text };
      if (ev === "filing_done") return { title: "Filing done", meta: row.text };
      if (ev === "filing_skip") return { title: "Filing skipped", meta: row.text };
      if (ev === "read_refresh_start") return { title: "Read refresh", meta: row.text };
      if (ev === "read_refresh_done") return { title: "Read refresh done", meta: row.text };
      if (ev === "read_refresh_skip") return { title: "Read refresh skipped", meta: row.text };
      if (ev === "model_ask") return { title: "Model", meta: row.phase ? "phase " + row.phase : row.text };
      if (ev === "model_reply") return { title: "Model reply", meta: hintFromRow(row) || row.text };
      if (ev === "model_no_tools") return { title: "No tool calls", meta: row.text };
      if (ev === "watcher_start") return { title: "Watcher on", meta: row.text };
      if (ev === "backoff") return { title: "Backoff", meta: row.text };
      return { title: ev || "SOI", meta: row.text || "" };
    }

    function fillDetail(el, arg, result) {
      const body = el.querySelector(".soi-card-body") || el;
      let detail = el.querySelector(".soi-card-detail");
      const hasArg = !!(arg && String(arg).trim());
      const hasResult = !!(result && String(result).trim() && String(result).trim() !== String(arg || "").trim());
      if (!hasArg && !hasResult) {
        if (detail) detail.remove();
        return;
      }
      if (!detail) {
        detail = document.createElement("div");
        detail.className = "soi-card-detail";
        body.appendChild(detail);
      }
      detail.replaceChildren();
      if (hasArg) {
        const a = document.createElement("div");
        a.className = "soi-card-arg";
        a.textContent = String(arg).trim();
        detail.appendChild(a);
      }
      if (hasResult) {
        const b = document.createElement("div");
        b.className = "soi-card-result";
        b.textContent = String(result).trim();
        detail.appendChild(b);
      }
    }

    function appendPhaseCard(row) {
      const copy = phaseCopy(row);
      const el = document.createElement("article");
      el.className = "soi-card phase" + (row.level === "error" || /error/.test(row.event || "") ? " error-ev" : "");
      el.innerHTML =
        '<div class="soi-card-body">' +
          '<span class="soi-phase-label"></span>' +
          '<div class="soi-card-detail"><p class="soi-phase-meta"></p></div>' +
        "</div>";
      el.querySelector(".soi-phase-label").textContent = copy.title;
      const metaText = prettyPhaseMeta(copy.meta || "");
      const metaEl = el.querySelector(".soi-phase-meta");
      if (metaText) metaEl.textContent = metaText;
      else metaEl.parentElement.remove();
      soiFeed.appendChild(el);
    }

    function appendToolStart(row) {
      const name = row.name || "tool";
      const el = document.createElement("article");
      el.className = "soi-card pending " + toolClass(name);
      el.innerHTML =
        '<div class="soi-card-body">' +
          '<div class="soi-card-top">' +
            '<span class="soi-tool-badge"></span>' +
            '<span class="soi-card-status"></span>' +
          "</div>" +
        "</div>";
      el.querySelector(".soi-tool-badge").textContent = toolLabel(name);
      el.querySelector(".soi-card-status").textContent = statusLabel("running");
      const hint = hintFromRow(row);
      el.dataset.arg = hint;
      fillDetail(el, hint, "");
      soiFeed.appendChild(el);
      const stack = pendingTools.get(name) || [];
      stack.push(el);
      pendingTools.set(name, stack);
    }

    function appendToolDone(row) {
      const name = row.name || "tool";
      const stack = pendingTools.get(name) || [];
      let el = stack.pop();
      const ok = row.ok !== false;
      if (!el) {
        appendToolStart({
          name,
          hint: row.hint,
          arguments: row.arguments,
          summary: row.summary,
        });
        el = (pendingTools.get(name) || []).pop();
      }
      if (!el) return;
      el.classList.remove("pending");
      el.classList.add(ok ? "ok" : "fail");
      const status = el.querySelector(".soi-card-status");
      if (status) status.textContent = statusLabel(ok ? "ok" : "fail");
      fillDetail(el, el.dataset.arg || hintFromRow(row), prettySummary(row.summary || ""));
    }

    function appendNoteCard(row, kind) {
      const el = document.createElement("article");
      el.className = "soi-card " + (kind || "note");
      el.innerHTML = '<div class="soi-card-body"><div class="soi-card-detail"><p class="soi-card-hint"></p></div></div>';
      el.querySelector(".soi-card-hint").textContent = prettyPhaseMeta(row.text || "") || prettySummary(row.text || "");
      soiFeed.appendChild(el);
    }

    function appendSoiCard(row) {
      const ev = row.event || "log";
      if (ev === "tool_start") appendToolStart(row);
      else if (ev === "tool_done") appendToolDone(row);
      else if (
        ev === "idle_wake" || ev === "filing_start" || ev === "filing_done" ||
        ev === "filing_skip" || ev === "read_refresh_start" || ev === "read_refresh_done" ||
        ev === "read_refresh_skip" || ev === "model_ask" || ev === "model_reply" ||
        ev === "model_no_tools" || ev === "watcher_start" || ev === "backoff"
      ) appendPhaseCard(row);
      else if (ev === "error" || ev === "model_error" || ev === "filing_error" || ev === "read_refresh_error") {
        appendNoteCard(row, "error-ev");
      } else {
        appendNoteCard(row, "note");
      }
    }

    function asText(v) {
      if (v == null) return "";
      if (typeof v === "string") return v;
      if (typeof v === "number" || typeof v === "boolean") return String(v);
      if (typeof v === "object") {
        if (typeof v.text === "string") return v.text;
        if (typeof v.reply === "string") return v.reply;
        if (typeof v.error === "string") return v.error;
        return "";
      }
      return String(v);
    }

    function addMessage(text, kind) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + kind;
      if (kind === "user" || kind === "bot") {
        const label = document.createElement("div");
        label.className = "msg-label";
        label.textContent = kind === "user" ? "You" : "OAC";
        wrap.appendChild(label);
      }
      if (kind === "bot") {
        const tools = document.createElement("div");
        tools.className = "tool-log";
        tools.hidden = true;
        wrap.appendChild(tools);
        wrap._tools = tools;
        wrap._pendingTools = new Map();
      }
      const body = document.createElement("div");
      body.className = "msg-body" + (kind === "bot" ? " plain" : "");
      const content = asText(text);
      if (content) body.textContent = content;
      wrap.appendChild(body);
      wrap._body = body;
      if (!content && kind !== "bot") return wrap;
      logEl.appendChild(wrap);
      logEl.scrollTop = logEl.scrollHeight;
      return wrap;
    }

    function addBubble(text, kind) {
      return addMessage(text, kind);
    }

    function extractMath(src) {
      const chunks = [];
      const push = (tex, display) => {
        const i = chunks.length;
        chunks.push({ tex, display });
        return "@@MATH" + i + "@@";
      };
      let s = String(src || "");
      // Protect currency like $500 / $1,000 / $424.99 so KaTeX doesn't eat prices.
      s = s.replace(/\\\$/g, "@@DOLLAR@@");
      s = s.replace(/\$(\d[\d,]*(?:\.\d+)?)/g, "@@CUR$$$1@@");
      s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => push(tex, true));
      s = s.replace(/\\\(([\s\S]+?)\\\)/g, (_, tex) => push(tex, false));
      s = s.replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => push(tex, true));
      // Only treat $...$ as math when it doesn't look like leftover currency noise.
      s = s.replace(/\$([^$\n]{1,400}?)\$/g, (full, tex) => {
        const t = String(tex || "").trim();
        if (!t) return full;
        if (/^\d/.test(t)) return full; // still price-like
        if (/https?:\/\//i.test(t)) return full;
        return push(tex, false);
      });
      s = s.replace(/@@CUR\$(\d[\d,]*(?:\.\d+)?)@@/g, "$$$1");
      s = s.replace(/@@DOLLAR@@/g, "\\$");
      return { text: s, chunks };
    }

    function restoreMathPlaceholders(html, chunks) {
      return String(html || "").replace(/@@MATH(\d+)@@/g, (_, n) => {
        const i = Number(n);
        const item = chunks[i];
        if (!item) return "";
        // Prefer \( \) / \[ \] so KaTeX always sees math even if $ is ignored.
        if (item.display) return "\\[" + item.tex + "\\]";
        return "\\(" + item.tex + "\\)";
      });
    }

    function renderKatex(el) {
      if (!el || typeof renderMathInElement !== "function") return;
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false },
        ],
        throwOnError: false,
        strict: "ignore",
        trust: false,
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      });
    }

    function renderBotMarkdown(body, text, opts) {
      const streaming = !!(opts && opts.streaming);
      const raw = String(text || "");
      body.classList.remove("plain", "sys");
      if (streaming) body.classList.add("streaming");
      else body.classList.remove("streaming");
      body.classList.add("md");
      if (!raw.trim()) {
        if (!streaming) {
          body.classList.add("plain");
          body.classList.remove("md");
          body.textContent = "(empty reply)";
        }
        return;
      }
      if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
        body.classList.add("plain");
        body.classList.remove("md");
        body.textContent = raw;
        return;
      }
      try {
        const nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80;
        const { text: protectedText, chunks } = extractMath(raw);
        marked.setOptions({ gfm: true, breaks: true });
        const dirty = restoreMathPlaceholders(marked.parse(protectedText), chunks);
        body.innerHTML = DOMPurify.sanitize(dirty, {
          USE_PROFILES: { html: true },
          ADD_ATTR: ["target", "rel"],
        });
        body.querySelectorAll('a[href^="http"]').forEach((a) => {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        });
        if (typeof renderMathInElement === "function") {
          renderKatex(body);
        }
        if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
      } catch (e) {
        body.classList.add("plain");
        body.classList.remove("md");
        body.textContent = raw;
      }
    }

    function scheduleLiveMarkdown(body, getText) {
      const text = typeof getText === "function" ? getText() : getText;
      if (!text) return;
      if (!body.classList.contains("md")) {
        if (body._mdTimer) {
          clearTimeout(body._mdTimer);
          body._mdTimer = null;
        }
        renderBotMarkdown(body, text, { streaming: true });
        return;
      }
      if (body._mdTimer) return;
      body._mdTimer = setTimeout(() => {
        body._mdTimer = null;
        const latest = typeof getText === "function" ? getText() : getText;
        if (latest) renderBotMarkdown(body, latest, { streaming: true });
      }, 40);
    }

    function flushLiveMarkdown(body, text) {
      if (body._mdTimer) {
        clearTimeout(body._mdTimer);
        body._mdTimer = null;
      }
      renderBotMarkdown(body, text, { streaming: false });
    }

    function chatToolStart(msg, row) {
      if (!msg || !msg._tools) return;
      const body = msg._body;
      if (body) {
        body.classList.remove("sys");
        if (body.textContent === "…" || body.textContent === "...") {
          body.textContent = "";
        }
      }
      msg._tools.hidden = false;
      const name = row.name || "tool";
      const el = document.createElement("div");
      el.className = "tool-row running " + toolClass(name);
      el.innerHTML =
        '<span class="tool-dot"></span>' +
        '<div class="tool-main"><div class="tool-name"></div><div class="tool-detail"></div></div>' +
        '<span class="tool-status"></span>';
      el.querySelector(".tool-name").textContent = toolLabel(name);
      el.querySelector(".tool-status").textContent = statusLabel("running");
      const detailEl = el.querySelector(".tool-detail");
      let detail = hintFromRow(row);
      if (!detail && name === "save_research") detail = "Saving brief…";
      if (!detail && name === "web_fetch") detail = "Reading page…";
      if (!detail && name === "web_search") detail = "Searching…";
      if (!detail && name === "image_search") detail = "Finding pictures…";
      if (!detail && name === "create_plot") detail = "Building chart…";
      if (detail) detailEl.textContent = detail;
      else detailEl.remove();
      el.dataset.arg = detail || "";
      msg._tools.appendChild(el);
      const stack = msg._pendingTools.get(name) || [];
      stack.push(el);
      msg._pendingTools.set(name, stack);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function chatToolDone(msg, row) {
      if (!msg || !msg._pendingTools) return;
      const name = row.name || "tool";
      const stack = msg._pendingTools.get(name) || [];
      let el = stack.pop();
      const ok = row.ok !== false;
      if (!el) {
        chatToolStart(msg, row);
        el = (msg._pendingTools.get(name) || []).pop();
      }
      if (!el) return;
      el.classList.remove("running");
      el.classList.add(ok ? "ok" : "fail");
      const status = el.querySelector(".tool-status");
      if (status) status.textContent = statusLabel(ok ? "ok" : "fail");
      const detailEl = el.querySelector(".tool-detail") || (() => {
        const d = document.createElement("div");
        d.className = "tool-detail";
        el.querySelector(".tool-main").appendChild(d);
        return d;
      })();
      const arg = el.dataset.arg || hintFromRow(row);
      const summary = prettySummary(row.summary || "");
      detailEl.textContent = [arg, summary].filter(Boolean).join("\n");
      if (ok && Array.isArray(row.articles) && row.articles.length) {
        renderArticleCards(msg._tools, row.articles);
      }
      if (ok && Array.isArray(row.images) && row.images.length) {
        renderImageGallery(msg._tools, row.images);
      }
      if (ok && row.plot) {
        renderPlotCard(msg._tools, row.plot, row.plot_meta || {});
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function sliceTraceByX(trace, progress) {
      const t = JSON.parse(JSON.stringify(trace));
      const xs = Array.isArray(t.x) ? t.x : null;
      const ys = Array.isArray(t.y) ? t.y : null;
      const zs = Array.isArray(t.z) && t.z.length && typeof t.z[0] !== "object" ? t.z : null;
      if (!xs || !ys || Array.isArray(xs[0])) return t;
      let xmin = Infinity;
      let xmax = -Infinity;
      for (const v of xs) {
        const n = Number(v);
        if (!Number.isFinite(n)) continue;
        if (n < xmin) xmin = n;
        if (n > xmax) xmax = n;
      }
      if (!Number.isFinite(xmin) || !Number.isFinite(xmax)) return t;
      const cutoff = xmin + (xmax - xmin) * progress;
      const nx = [];
      const ny = [];
      const nz = [];
      for (let i = 0; i < xs.length; i++) {
        if (Number(xs[i]) <= cutoff + 1e-12) {
          nx.push(xs[i]);
          ny.push(ys[i]);
          if (zs) nz.push(zs[i]);
        }
      }
      t.x = nx;
      t.y = ny;
      if (zs) t.z = nz;
      return t;
    }

    function animateFigure(host, figure, meta) {
      const fullData = Array.isArray(figure.data) ? figure.data : [];
      const layout = Object.assign({}, figure.layout || {});
      const cfg = {
        responsive: true,
        displayModeBar: false,
        staticPlot: false,
        locale: "en",
      };
      const wantAnim = meta.animate !== false && layout.ainet_animate !== false;
      const chart = String(meta.chart || layout.ainet_chart || "");
      const canSlice = fullData.some(
        (tr) => Array.isArray(tr.x) && Array.isArray(tr.y) && !Array.isArray(tr.x[0])
      );

      if (!wantAnim || typeof Plotly === "undefined") {
        Plotly.newPlot(host, fullData, layout, cfg);
        return;
      }

      if (canSlice && !/surface|isosurface|heatmap|contour|pie|box|mesh3d/i.test(chart)) {
        const empty = fullData.map((tr) => sliceTraceByX(tr, 0));
        Plotly.newPlot(host, empty, layout, cfg).then(() => {
          const t0 = performance.now();
          const dur = 1500;
          const tick = (now) => {
            const p = easeOutCubic(Math.min(1, (now - t0) / dur));
            const frame = fullData.map((tr) => sliceTraceByX(tr, p));
            Plotly.react(host, frame, layout, cfg);
            if (p < 1) requestAnimationFrame(tick);
            else Plotly.react(host, fullData, layout, cfg);
          };
          requestAnimationFrame(tick);
        });
        return;
      }

      // Surfaces / heatmaps: fade + slight camera ease
      const faded = fullData.map((tr) => {
        const t = Object.assign({}, tr);
        if (t.type === "surface" || t.type === "mesh3d" || t.type === "isosurface") t.opacity = 0.05;
        else if (t.type === "heatmap" || t.type === "contour") t.opacity = 0.15;
        return t;
      });
      Plotly.newPlot(host, faded, layout, cfg).then(() => {
        const t0 = performance.now();
        const dur = 1500;
        const tick = (now) => {
          const p = easeOutCubic(Math.min(1, (now - t0) / dur));
          const frame = fullData.map((tr) => {
            const t = Object.assign({}, tr);
            if (t.type === "surface" || t.type === "mesh3d" || t.type === "isosurface") t.opacity = 0.05 + 0.91 * p;
            else if (t.type === "heatmap" || t.type === "contour") t.opacity = 0.15 + 0.85 * p;
            return t;
          });
          Plotly.react(host, frame, layout, cfg);
          if (p < 1) requestAnimationFrame(tick);
          else Plotly.react(host, fullData, layout, cfg);
        };
        requestAnimationFrame(tick);
      });
    }

    function isPlot3d(figure, meta) {
      const chart = String((meta && meta.chart) || (figure.layout && figure.layout.ainet_chart) || "");
      if (/surface|isosurface|scatter3d|line3d|mesh3d/i.test(chart)) return true;
      const data = Array.isArray(figure.data) ? figure.data : [];
      return data.some((tr) =>
        tr && /surface|isosurface|scatter3d|mesh3d/i.test(String(tr.type || ""))
      );
    }

    function renderPlotCard(parent, figure, meta) {
      if (!parent || !figure || typeof figure !== "object") return;
      if (typeof Plotly === "undefined") {
        const miss = document.createElement("div");
        miss.className = "tool-detail";
        miss.textContent = "Plotly failed to load — hard-refresh the page.";
        parent.appendChild(miss);
        return;
      }
      meta = meta || {};
      const wide3d = isPlot3d(figure, meta);
      const card = document.createElement("div");
      card.className = "plot-card" + (wide3d ? " is-3d" : "");
      const head = document.createElement("div");
      head.className = "plot-meta";
      const title = document.createElement("strong");
      title.textContent = meta.title || (figure.layout && figure.layout.title && figure.layout.title.text) || "Chart";
      const side = document.createElement("span");
      const bits = [];
