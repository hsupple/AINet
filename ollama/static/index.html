      if (meta.chart) bits.push(String(meta.chart));
      if (meta.source) bits.push(String(meta.source));
      side.textContent = bits.join(" · ");
      head.appendChild(title);
      head.appendChild(side);
      const host = document.createElement("div");
      host.className = "plot-host";
      card.appendChild(head);
      card.appendChild(host);
      parent.appendChild(card);
      if (wide3d) {
        const msg = parent.closest(".msg");
        if (msg) msg.classList.add("has-wide-plot");
        const layout = figure.layout || (figure.layout = {});
        const hostH = Math.round(Math.min(window.innerHeight * 0.62, 640));
        layout.height = Math.max(Number(layout.height) || 0, hostH);
        layout.autosize = true;
        if (layout.margin) {
          layout.margin = Object.assign({}, layout.margin, { l: 4, r: 4, t: layout.title ? 48 : 20, b: 4 });
        }
      }
      try {
        animateFigure(host, figure, meta);
        if (wide3d && typeof Plotly !== "undefined") {
          requestAnimationFrame(() => {
            try { Plotly.Plots.resize(host); } catch (_) {}
          });
        }
      } catch (err) {
        host.textContent = "Could not render chart: " + String(err);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function isHttpUrl(s) {
      try {
        const u = new URL(String(s || ""));
        return u.protocol === "http:" || u.protocol === "https:";
      } catch {
        return false;
      }
    }

    function renderImageGallery(parent, images) {
      if (!parent || !Array.isArray(images) || !images.length) return;
      const gal = document.createElement("div");
      gal.className = "img-gallery";
      for (const item of images.slice(0, 8)) {
        if (!item || typeof item !== "object") continue;
        const thumb = String(item.thumbnail || item.image_url || "").trim();
        const href = String(item.page_url || item.url || item.image_url || thumb).trim();
        if (!isHttpUrl(thumb)) continue;
        const a = document.createElement("a");
        a.className = "img-tile";
        a.href = isHttpUrl(href) ? href : thumb;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = item.title || item.source || "";
        const img = document.createElement("img");
        img.src = thumb;
        img.alt = item.title || "image";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        a.appendChild(img);
        const cap = document.createElement("span");
        cap.className = "img-cap";
        cap.textContent = item.source || item.title || "";
        a.appendChild(cap);
        gal.appendChild(a);
      }
      if (gal.childElementCount) parent.appendChild(gal);
    }

    function renderArticleCards(parent, articles) {
      if (!parent || !Array.isArray(articles) || !articles.length) return;
      const wrap = document.createElement("div");
      wrap.className = "article-cards";
      const rows = articles.slice(0, 3);
      const heroIdx = rows.findIndex((item) => isHttpUrl(item && (item.thumbnail || item.image_url)));
      rows.forEach((item, i) => {
        if (!item || typeof item !== "object") return;
        const href = String(item.url || item.page_url || "").trim();
        const thumb = String(item.thumbnail || item.image_url || "").trim();
        const card = document.createElement(isHttpUrl(href) ? "a" : "div");
        card.className = "article-card";
        if (i === (heroIdx >= 0 ? heroIdx : 0) && isHttpUrl(thumb)) card.classList.add("hero");
        if (!isHttpUrl(thumb)) card.classList.add("no-thumb");
        if (card.tagName === "A") {
          card.href = href;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }
        if (isHttpUrl(thumb)) {
          const media = document.createElement("div");
          media.className = "article-thumb";
          const img = document.createElement("img");
          img.src = thumb;
          img.alt = item.title || "Article";
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          img.addEventListener("error", () => {
            media.remove();
            card.classList.remove("hero");
            card.classList.add("no-thumb");
          });
          media.appendChild(img);
          card.appendChild(media);
        }
        const body = document.createElement("div");
        body.className = "article-body";
        const kicker = document.createElement("div");
        kicker.className = "article-kicker";
        kicker.textContent = item.source ? "Opened · " + item.source : "Opened";
        body.appendChild(kicker);
        const title = document.createElement("div");
        title.className = "article-title";
        title.textContent = item.title || href || "Article";
        body.appendChild(title);
        if (item.snippet) {
          const snip = document.createElement("div");
          snip.className = "article-snip";
          snip.textContent = item.snippet;
          body.appendChild(snip);
        }
        card.appendChild(body);
        wrap.appendChild(card);
      });
      if (wrap.childElementCount) parent.appendChild(wrap);
    }

    function renderMeta(s) {
      const hang = s.hang || {};
      const inf = hang.inference || {};
      const bits = [];
      if (s.last_error) bits.push(String(s.last_error).slice(0, 140));
      if (hang.ask_lock) bits.push("ask lock");
      if (inf.locked) bits.push((inf.holder || "gpu") + " " + inf.held_s + "s");
      const hangHtml = bits.length
        ? "<br><span style=\"color:var(--danger)\">" + escapeHtml(bits.join(" · ")) + "</span>"
        : "";
      const esp = s.esp32 || {};
      const stt = esp.stt || {};
      let espLine = "";
      if (esp.connected) espLine = "<br>ESP32 mic live";
      else if (esp.ping_ok) espLine = "<br>ESP32 ping";
      else if (esp.streaming) espLine = "<br>ESP32 connecting";
      if (stt.ready && espLine) espLine += " · STT " + escapeHtml(stt.model || "on");
      else if (espLine && stt.error) espLine += "<br><span style=\"color:var(--danger)\">STT " + escapeHtml(String(stt.error).slice(0, 90)) + "</span>";
      meta.innerHTML =
        "<strong>" + (s.model || "?") + "</strong><br>" +
        "mode " + (s.mode || "?") +
        (s.project_name ? "<br>project " + s.project_name : "") +
        (s.session_id ? "<br>session " + s.session_id.slice(0, 8) : "") +
        (s.soi_running ? "<br>SOI running" : "<br>SOI idle") +
        espLine +
        hangHtml;
      if (Array.isArray(s.modes) && modeSel.options.length === 0) {
        for (const m of s.modes) {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.name || m.id;
          modeSel.appendChild(opt);
        }
      }
      if (s.mode) modeSel.value = s.mode;
      if (s.session_id) currentChatId = s.session_id;
      if (Object.prototype.hasOwnProperty.call(s, "soi_running")) {
        setSoiUi(!!s.soi_running);
      }
      updateSpotifyBtn(s.spotify || {});
      appendSoiLines(s.soi_log || []);
    }

    function updateSpotifyBtn(sp) {
      const btn = document.getElementById("spotify-btn");
      if (!btn) return;
      btn.classList.remove("linked", "needs-setup");
      if (sp.connected) {
        btn.textContent = "Spotify ✓";
        btn.classList.add("linked");
        btn.title = "Spotify linked — click to re-authorize";
      } else if (sp.configured) {
        btn.textContent = "Link Spotify";
        btn.title = "Authorize Spotify in the browser";
      } else {
        btn.textContent = "Spotify setup";
        btn.classList.add("needs-setup");
        btn.title = "Paste Client ID + Secret first (ask in chat or use console)";
      }
    }

    function lineText(row) {
      return asText(row);
    }

    function lineId(row) {
      if (row && typeof row === "object" && row.id != null) return Number(row.id) || 0;
      return 0;
    }

    function appendSoiLines(rows) {
      if (!Array.isArray(rows) || !rows.length) return;
      let added = false;
      for (const row of rows) {
        const id = lineId(row);
        const parsed = parseSoiRow(row);
        const text = parsed.text || lineText(row);
        if (!text && !parsed.event) continue;
        if (id && id <= lastSoiId) continue;
        if (id) lastSoiId = id;
        if (text) soiOut.textContent += (soiOut.textContent ? "\n" : "") + text;
        appendSoiCard(parsed);
        added = true;
      }
      if (added) {
        soiOut.scrollTop = soiOut.scrollHeight;
        soiFeed.scrollTop = soiFeed.scrollHeight;
      }
    }

    function setSoiUi(running) {
      soiBtn.disabled = false;
      soiBtn.classList.toggle("running", !!running);
      soiBtn.classList.toggle("stop-soi", !!running);
      soiBtn.textContent = running ? "Stop SOI" : "Start SOI";
      if (soiPhase2Btn) soiPhase2Btn.disabled = !!running;
      soiState.classList.toggle("on", !!running);
      soiState.textContent = running ? "Running" : "Idle";
    }

    function setChatBusy(on) {
      busy = !!on;
      sendBtn.disabled = false;
      sendBtn.classList.toggle("stop", busy);
      sendBtn.textContent = busy ? "Stop" : "Send";
      sendBtn.type = busy ? "button" : "submit";
    }

    async function pullSoiLog() {
      try {
        const r = await fetch("/api/soi-log?after=" + lastSoiId);
        const s = await r.json();
        if (s.ok) {
          appendSoiLines(s.lines || []);
          if (Object.prototype.hasOwnProperty.call(s, "soi_running")) {
            setSoiUi(!!s.soi_running);
          }
        }
      } catch (e) {}
    }

    const espTurns = new Map();
    function clearEspTurns() {
      espTurns.clear();
    }
    async function pullEsp32() {
      try {
        const r = await fetch("/api/esp32/status");
        const s = await r.json();
        if (!s || !s.ok) return;
        for (const t of s.turns || []) {
          const id = Number(t.id || 0);
          if (!id) continue;
          let rec = espTurns.get(id);
          if (!rec) {
            rec = {
              user: addMessage(t.text || "", "user"),
              bot: addMessage(t.reply || (t.status === "asking" ? "…" : ""), "bot"),
            };
            espTurns.set(id, rec);
          }
          if (rec.bot && rec.bot._body) {
            if (t.error) rec.bot._body.textContent = String(t.error);
            else if (t.reply) rec.bot._body.textContent = t.reply;
            else if (t.status === "asking") rec.bot._body.textContent = "…";
          }
        }
      } catch (e) {}
    }

    async function refreshStatus() {
      try {
        const r = await fetch("/api/status");
        const s = await r.json();
        if (s.ok) renderMeta(s);
      } catch (e) {
        meta.textContent = "Server offline";
      }
    }

    async function post(path, body, timeoutMs) {
      const ctrl = new AbortController();
      const timer = timeoutMs
        ? setTimeout(() => ctrl.abort(), timeoutMs)
        : null;
      try {
        const r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
          signal: ctrl.signal,
        });
        return await r.json();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    async function streamChat(message, botMsg, onDone) {
      chatAbort = new AbortController();
      lastChatEventAt = Date.now();
      stallNoticeShown = false;
      const r = await fetch("/api/chat-stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, voice: false }),
        signal: chatAbort.signal,
      });
      if (!r.ok || !r.body) {
        throw new Error("chat-stream failed (" + r.status + ")");
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let full = "";
      let donePayload = null;
      let err = null;
      let aborted = false;
      const body = botMsg._body;

      const handleEvent = (ev) => {
        if (!ev || typeof ev !== "object") return;
        lastChatEventAt = Date.now();
        if (ev.type === "ping") {
          return;
        }
        if (ev.type === "tool_start") {
          chatToolStart(botMsg, ev);
        } else if (ev.type === "tool_done") {
          chatToolDone(botMsg, ev);
          if (ev.name === "save_research" && ev.ok) {
            const meta = ev.research || {};
            loadResearchBrief({ id: meta.id, path: meta.path });
          }
        } else if (ev.type === "context") {
          renderDevContext(ev);
        } else if (ev.type === "status") {
          const who = ev.holder || ev.phase || "model";
          const held = ev.held_s != null ? " (" + ev.held_s + "s)" : "";
          const msg = "Waiting — " + who + " has Ollama" + held;
          if (!full) {
            body.classList.add("sys");
            body.textContent = msg;
          }
        } else if (ev.type === "token") {
          const t = asText(ev.text);
          if (!t) return;
          if (body.classList.contains("sys")) {
            body.classList.remove("sys");
            body.textContent = "";
          }
          if (!full && body.textContent === "…") body.textContent = "";
          full += t;
          scheduleLiveMarkdown(body, () => full);
        } else if (ev.type === "done") {
          donePayload = ev;
          const finalReply = asText(ev.reply);
          const streamed = full.trim();
          if (!streamed) {
            full = finalReply || (ev.cancelled ? "(stopped)" : "(empty reply)");
          } else if (finalReply && finalReply.length > streamed.length) {
            full = finalReply;
          }
          if (ev.cancelled && full && !/\(stopped\)\s*$/.test(full)) {
            full = full.replace(/\s*$/, "") + "\n\n(stopped)";
          }
          flushLiveMarkdown(body, full);
          if (typeof onDone === "function") onDone();
        } else if (ev.type === "error") {
          err = asText(ev.error || "Error");
          if (body._mdTimer) {
            clearTimeout(body._mdTimer);
            body._mdTimer = null;
          }
          body.classList.remove("streaming");
          if (typeof onDone === "function") onDone();
        }
      };

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf("\n\n")) >= 0) {
            const raw = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const line = raw.split("\n").find((l) => l.startsWith("data:"));
            if (!line) continue;
            const payload = line.slice(5).trim();
            if (!payload) continue;
            try { handleEvent(JSON.parse(payload)); }
            catch (e) {}
          }
        }
      } catch (e) {
        if (e && e.name === "AbortError") aborted = true;
        else throw e;
      }
      if (body._mdTimer) {
        clearTimeout(body._mdTimer);
        body._mdTimer = null;
      }
      body.classList.remove("streaming");
      if (err) throw new Error(err);
      if (aborted) {
        if (!full) full = "(stopped)";
        else if (!/\(stopped\)\s*$/.test(full)) full = full.replace(/\s*$/, "") + "\n\n(stopped)";
        flushLiveMarkdown(body, full);
        return { ok: true, reply: full, cancelled: true };
      }
      if (full && !body.classList.contains("md")) {
        flushLiveMarkdown(body, full);
      }
      return donePayload || { ok: true, reply: full };
    }

    async function stopChat() {
      if (chatAbort) {
        try { chatAbort.abort(); } catch (e) {}
        chatAbort = null;
      }
      try { await post("/api/cancel", { chat: true, soi: true }, 2000); } catch (e) {}
      setChatBusy(false);
    }

    function resetChatUi() {
      setChatBusy(false);
      chatAbort = null;
      logEl.innerHTML = "";
      clearEspTurns();
      setSoiUi(false);
    }

    async function resetAi(hard) {
      // Free sockets first — a wedged chat + SOI stream can fill the browser's
      // 6-connection pool so /api/reset never leaves the page.
      setChatBusy(false);
      lastChatEventAt = 0;
      if (chatAbort) {
        try { chatAbort.abort(); } catch (e) {}
        chatAbort = null;
      }
      closeSoiStream();
      const hanging = logEl.querySelector(".msg.bot:last-child");
      if (hanging && hanging._body && (hanging._body.textContent === "…" || hanging._body.classList.contains("sys"))) {
        hanging._body.classList.remove("sys", "streaming", "md");
        hanging._body.classList.add("plain");
        hanging._body.textContent = hard ? "Reset AI — cancelled." : "Stopped.";
      }

      if (hard) {
        // Fire cancel+reset without awaiting forever, then reload no matter what.
        const hardReset = (async () => {
          try { await post("/api/cancel", { chat: true, soi: true }, 1500); } catch (e) {}
          try { await post("/api/reset", { hard: true }, 2500); } catch (e) {}
        })();
        try { await Promise.race([hardReset, new Promise((r) => setTimeout(r, 3000))]); } catch (e) {}
        resetChatUi();
        location.reload();
        return { ok: true };
      }

      let data;
      try {
        data = await post("/api/reset", { hard: false }, 5000);
      } catch (err) {
        addMessage("Reset failed — " + asText(err), "sys");
        setChatBusy(false);
        connectSoiStream();
        return { ok: false };
      }
      if (data && data.ok) {
        logEl.innerHTML = "";
        clearEspTurns();
        addMessage("New chat", "sys");
        renderMeta(data);
        await loadChats();
      } else {
        addMessage(asText((data && data.error) || "Reset failed"), "sys");
      }
      setChatBusy(false);
      connectSoiStream();
      input.focus();
      return data;
    }

    sendBtn.addEventListener("click", async (e) => {
      if (!busy) return;
      e.preventDefault();
      e.stopPropagation();
      await stopChat();
      setChatBusy(false);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      setChatBusy(true);
      addMessage(text, "user");
      input.value = "";
      const botMsg = addMessage("…", "bot");
      botMsg._body.classList.add("sys");
      const unlockSend = () => {
        chatAbort = null;
        lastChatEventAt = 0;
        setChatBusy(false);
        input.focus();
      };
      try {
        const data = await streamChat(text, botMsg, unlockSend);
        if (data && data.ok === false) {
          botMsg.classList.add("error");
          botMsg._body.classList.add("plain");
          botMsg._body.classList.remove("md", "sys");
          botMsg._body.textContent = data.error || "Error";
        } else if (data) {
          renderMeta(data);
          loadChats();
        }
      } catch (err) {
        botMsg.classList.add("error");
        botMsg._body.classList.add("plain");
        botMsg._body.classList.remove("md", "sys");
        botMsg._body.textContent = String(err);
      } finally {
        unlockSend();
        refreshStatus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      try { await resetAi(false); } catch (err) { addMessage(asText(err), "sys"); }
    });
    if (chatsNew) chatsNew.addEventListener("click", async () => {
      try { await resetAi(false); } catch (err) { addMessage(asText(err), "sys"); }
    });
    document.getElementById("hard-reset").addEventListener("click", async () => {
      try { await resetAi(true); } catch (err) { addMessage(asText(err), "sys"); }
    });
    document.getElementById("spotify-btn").addEventListener("click", async () => {
      try {
        const r = await fetch("/api/spotify/status");
        const s = await r.json();
        if (!s.configured) {
          addMessage(
            "Spotify needs your Client ID and Client Secret from the Spotify Developer Dashboard. Paste them here in chat (or tell Cursor) and I’ll save them, then click Link Spotify.",
            "sys"
          );
          return;
        }
        window.open("/auth/spotify", "_blank", "noopener");
      } catch (err) {
        addMessage("Could not reach Spotify status: " + asText(err), "sys");
      }
    });

    soiBtn.addEventListener("click", async () => {
      if (soiBtn.classList.contains("stop-soi")) {
        try {
          const data = await post("/api/cancel", { chat: false, soi: true });
          addMessage("SOI stop requested", "sys");
          setSoiUi(!!data.soi_running);
          refreshStatus();
        } catch (err) {
          addMessage(asText(err), "sys");
        }
        return;
      }
      setSoiUi(true);
      try {
        const data = await post("/api/soi", {});
        if (!data.ok) {
          addMessage(asText(data.error || data.reason || "SOI failed to start"), "sys");
          setSoiUi(false);
          return;
        }
        if (data.started === false) {
          addMessage(asText(data.reason || "SOI not started"), "sys");
          setSoiUi(!!data.soi_running);
          return;
        }
        const pending = Number(data.pending_changelog || 0);
        if (pending === 0) {
          addMessage("SOI started — Changelog empty, nothing to file yet.", "sys");
        } else {
          addMessage("SOI started — " + pending + " pending changelog entr" + (pending === 1 ? "y" : "ies") + ".", "sys");
        }
        appendSoiLines(data.soi_log || data.lines || []);
        setSoiUi(!!(data.soi_running || data.started));
      } catch (err) {
        addMessage(asText(err), "sys");
        setSoiUi(false);
      }
    });

    if (soiPhase2Btn) soiPhase2Btn.addEventListener("click", async () => {
      if (soiBtn.classList.contains("stop-soi")) return;
      setSoiUi(true);
      try {
        const data = await post("/api/soi/phase2", {});
        if (!data.ok) {
          addMessage(asText(data.error || data.reason || "Phase 2 failed to start"), "sys");
          setSoiUi(false);
          return;
        }
        if (data.started === false) {
          addMessage(asText(data.reason || "Phase 2 not started"), "sys");
          setSoiUi(!!data.soi_running);
          return;
        }
        const stale = Number(data.stale_count || 0);
        if (stale === 0) {
          addMessage("Phase 2 started — no stale Read.json files right now.", "sys");
        } else {
          addMessage(
            "Phase 2 started — " + stale + " stale Read.json file" + (stale === 1 ? "" : "s") + ".",
            "sys"
          );
        }
        appendSoiLines(data.soi_log || data.lines || []);
        setSoiUi(!!(data.soi_running || data.started));
      } catch (err) {
        addMessage(asText(err), "sys");
        setSoiUi(false);
      }
    });

    modeSel.addEventListener("change", async () => {
      const data = await post("/api/mode", { mode: modeSel.value });
      if (!data.ok) addMessage(data.error || "Mode change failed", "sys error");
      else {
        addMessage("Mode → " + data.mode, "sys");
        renderMeta(data);
      }
    });

    function connectSoiStream() {
      if (!window.EventSource) {
        setInterval(pullSoiLog, 800);
        return;
      }
      closeSoiStream();
      soiEs = new EventSource("/api/soi-stream?after=" + lastSoiId);
      soiEs.onmessage = (ev) => {
        soiStreamOk = true;
        try {
          const s = JSON.parse(ev.data);
          appendSoiLines(s.lines || []);
          if (Object.prototype.hasOwnProperty.call(s, "soi_running")) {
            setSoiUi(!!s.soi_running);
          }
        } catch (err) {}
      };
      soiEs.onerror = () => {
        // Server closes the stream every ~25s so the connection pool stays free.
        // EventSource auto-reconnects; if READYSTATE is CLOSED, reopen ourselves.
        soiStreamOk = false;
        pullSoiLog();
        if (soiEs && soiEs.readyState === 2) {
          setTimeout(() => {
            if (!soiEs || soiEs.readyState === 2) connectSoiStream();
          }, 800);
        }
      };
    }

    refreshStatus();
    (async () => {
      try {
        const data = await post("/api/reset", { hard: false }, 5000);
        if (data && data.ok) {
          logEl.innerHTML = "";
          clearEspTurns();
          renderMeta(data);
        }
      } catch (e) {}
      await loadChats();
    })();
    pullSoiLog();
    connectSoiStream();
    pullEsp32();
    setInterval(refreshStatus, 8000);
    setInterval(pullEsp32, 700);
    // Only poll when the stream is down — a standing SSE plus a poll can starve
    // the browser's per-origin connection pool if a chat stream wedges.
    setInterval(() => { if (!soiStreamOk) pullSoiLog(); }, 1500);
    setInterval(checkChatWatchdog, 5000);
  </script>
</body>
</html>
