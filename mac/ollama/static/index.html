<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>AINet</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e1a17;
      --panel: rgba(18, 36, 32, 0.72);
      --line: rgba(214, 232, 220, 0.14);
      --text: #e7f2ea;
      --muted: #9bb5a8;
      --accent: #d4a24c;
      --accent-dim: rgba(212, 162, 76, 0.18);
      --user: #1f3d34;
      --bot: rgba(255, 255, 255, 0.04);
      --danger: #e08a6a;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Sora", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(212, 162, 76, 0.18), transparent 55%),
        radial-gradient(900px 600px at 100% 0%, rgba(62, 140, 118, 0.22), transparent 50%),
        linear-gradient(165deg, #07110e 0%, #122822 45%, #0a1613 100%);
      background-attachment: fixed;
    }

    .shell {
      max-width: 1360px;
      height: 100%;
      margin: 0 auto;
      padding: 1.25rem 1rem 1rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0.85rem;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(380px, 1fr);
      gap: 0.85rem;
    }
    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(280px, 42vh);
      }
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.75rem;
    }

    .brand {
      font-family: "Instrument Serif", serif;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .brand span {
      color: var(--accent);
      font-style: italic;
    }

    .meta {
      text-align: right;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .meta strong { color: var(--text); font-weight: 500; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.55rem;
    }

    button, select {
      font: inherit;
      font-size: 0.78rem;
      color: var(--text);
      background: var(--accent-dim);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }
    #soi {
      background: var(--accent);
      color: var(--ink);
      border: none;
      font-weight: 600;
    }
    #soi.running { opacity: 1; }
    #voice.off {
      opacity: 0.65;
      background: transparent;
    }
    #soi-state {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    #soi-state::before {
      content: "";
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: #6a8579;
    }
    #soi-state.on {
      color: #8ee0b0;
    }
    #soi-state.on::before {
      background: #5ee09a;
      box-shadow: 0 0 0 0 rgba(94, 224, 154, 0.7);
      animation: soi-pulse 1.2s ease-out infinite;
    }
    @keyframes soi-pulse {
      0% { box-shadow: 0 0 0 0 rgba(94, 224, 154, 0.55); }
      100% { box-shadow: 0 0 0 8px rgba(94, 224, 154, 0); }
    }

    #log {
      overflow-y: auto;
      padding: 0.25rem 0.15rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      scroll-behavior: smooth;
      min-height: 0;
    }

    .soi-panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(6, 14, 12, 0.72);
      border: 1px solid var(--line);
      border-radius: 1rem;
      overflow: hidden;
    }
    .soi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .soi-head strong { color: var(--accent); font-weight: 600; text-transform: none; letter-spacing: 0; }
    .soi-head-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }
    .soi-view {
      display: inline-flex;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
    }
    .soi-view button {
      padding: 0.18rem 0.55rem;
      font-size: 0.64rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: transparent;
      border: none;
      color: var(--muted);
      border-radius: 999px;
    }
    .soi-view button.on {
      background: var(--accent);
      color: var(--ink);
      font-weight: 600;
    }
    .soi-view button:hover { border: none; }
    .soi-body {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #soi-out, #soi-feed {
      position: absolute;
      inset: 0;
      overflow-y: auto;
    }
    #soi-out {
      margin: 0;
      padding: 0.7rem 0.8rem 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 0.74rem;
      line-height: 1.45;
      color: #cfe6d8;
    }
    .soi-panel.view-panel #soi-out { display: none; }
    .soi-panel.view-raw #soi-feed { display: none; }
    #soi-out:empty::before,
    #soi-feed:empty::before {
      content: "SOI output will stream here…";
      color: var(--muted);
      font-family: "Sora", sans-serif;
      font-size: 0.74rem;
    }
    #soi-feed {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      padding: 0.85rem 0.85rem 1.1rem;
    }
    .soi-card {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
      padding: 0.8rem 0.9rem 0.85rem;
      border: 1px solid var(--line);
      border-left: 5px solid var(--tool, #6a8579);
      border-radius: 0.85rem;
      background: rgba(255, 255, 255, 0.045);
      overflow: visible;
      animation: rise 180ms ease-out;
    }
    .soi-card-rail { display: none; }
    .soi-card-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0;
    }
    .soi-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .soi-tool-badge {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--tool, var(--accent));
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    .soi-card-status {
      flex: 0 0 auto;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .soi-card.pending .soi-card-status {
      color: #d4a24c;
    }
    .soi-card.pending .soi-card-status::before {
      content: "";
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      margin-right: 0.32rem;
      border-radius: 50%;
      border: 1.5px solid #d4a24c;
      border-top-color: transparent;
      vertical-align: -1px;
      animation: soi-spin 0.7s linear infinite;
    }
    .soi-card.ok .soi-card-status { color: #8ee0b0; }
    .soi-card.fail .soi-card-status { color: var(--danger); }
    .soi-card.fail { border-color: rgba(224, 138, 106, 0.45); }
    .soi-card-detail {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.55rem 0.65rem;
      border-radius: 0.55rem;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(214, 232, 220, 0.08);
    }
    .soi-card-arg,
    .soi-card-result,
    .soi-card-hint,
    .soi-phase-meta {
      margin: 0;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #d7ebe0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .soi-card-result {
      color: #b8d4c6;
      padding-top: 0.3rem;
      border-top: 1px solid rgba(214, 232, 220, 0.1);
    }
    .soi-card.phase {
      border-left-color: var(--accent);
      background: var(--accent-dim);
      border-color: rgba(212, 162, 76, 0.22);
    }
    .soi-phase-label {
      font-family: "Instrument Serif", serif;
      font-size: 1.15rem;
      line-height: 1.2;
      color: var(--accent);
    }
    .soi-phase-meta {
      color: var(--muted);
    }
    .soi-card.note { --tool: #6a8579; }
    .soi-card.error-ev {
      --tool: var(--danger);
      border-color: rgba(224, 138, 106, 0.4);
    }
    @keyframes soi-spin {
      to { transform: rotate(360deg); }
    }
    .tool-file_by_id { --tool: #d4a24c; }
    .tool-write_json, .tool-create_json, .tool-patch_json, .tool-set_json_path { --tool: #e08a6a; }
    .tool-create_cop, .tool-create_folder, .tool-move_path { --tool: #b388ff; }
    .tool-read_json, .tool-read_text { --tool: #6ec8b8; }
    .tool-list_dir, .tool-tree, .tool-get_tools { --tool: #8fbf7f; }
    .tool-web_search, .tool-web_fetch { --tool: #7eb6ff; }
    .tool-mark_read_stale, .tool-mark_read_refreshed { --tool: #5ec2c7; }
    .tool-capture_inbox { --tool: #e0c07a; }
    .tool-archive_to_history { --tool: #9aa7c2; }

    .bubble {
      max-width: min(92%, 640px);
      padding: 0.85rem 1rem;
      border-radius: 1rem;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-size: 0.95rem;
      animation: rise 220ms ease-out;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      border-color: rgba(212, 162, 76, 0.28);
    }
    .bubble.bot {
      align-self: flex-start;
      background: var(--bot);
      backdrop-filter: blur(8px);
    }
    .bubble.sys {
      align-self: center;
      max-width: 100%;
      font-size: 0.75rem;
      color: var(--muted);
      background: transparent;
      border-style: dashed;
      padding: 0.4rem 0.7rem;
    }
    .bubble.error { color: var(--danger); border-color: rgba(224, 138, 106, 0.4); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
      align-items: end;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      padding: 0.65rem;
      backdrop-filter: blur(10px);
    }

    textarea {
      width: 100%;
      min-height: 3.2rem;
      max-height: 9rem;
      resize: vertical;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      padding: 0.45rem 0.55rem;
      line-height: 1.45;
    }

    form button[type="submit"] {
      background: var(--accent);
      color: var(--ink);
      border: none;
      font-weight: 600;
      padding: 0.7rem 1.1rem;
      border-radius: 0.85rem;
    }

    .hint {
      grid-column: 1 / -1;
      font-size: 0.7rem;
      color: var(--muted);
      padding: 0 0.35rem 0.1rem;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1 class="brand">AI<span>Net</span></h1>
        <div class="toolbar">
          <select id="mode" title="Mode"></select>
          <button type="button" id="reset">New session</button>
          <button type="button" id="voice" title="Speak replies with Qwen3-TTS" aria-pressed="true">Voice on</button>
          <button type="button" id="soi">Start SOI</button>
        </div>
      </div>
      <div class="meta" id="meta">Connecting…</div>
    </header>

    <div class="workspace">
      <div id="log" aria-live="polite"></div>
      <aside class="soi-panel view-panel" id="soi-panel" aria-label="SOI output">
        <div class="soi-head">
          <div class="soi-head-left">
            <span><strong>SOI</strong> live</span>
            <div class="soi-view" role="tablist" aria-label="SOI view">
              <button type="button" id="soi-view-panel" data-view="panel">Panel</button>
              <button type="button" id="soi-view-raw" data-view="raw">Raw</button>
            </div>
          </div>
          <span id="soi-state">Idle</span>
        </div>
        <div class="soi-body">
          <div id="soi-feed"></div>
          <pre id="soi-out"></pre>
        </div>
      </aside>
    </div>

    <form id="form">
      <textarea id="input" rows="2" placeholder="Talk to the local model…" autofocus></textarea>
      <button type="submit" id="send">Send</button>
      <div class="hint">Turns persist via OAC → SOI idle filing into your db. Voice speaks each sentence as it streams. Enter to send · Shift+Enter for newline</div>
    </form>
  </div>

  <script>
    const logEl = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const meta = document.getElementById("meta");
    const modeSel = document.getElementById("mode");
    const soiBtn = document.getElementById("soi");
    const soiPanel = document.getElementById("soi-panel");
    const soiOut = document.getElementById("soi-out");
    const soiFeed = document.getElementById("soi-feed");
    const soiState = document.getElementById("soi-state");
    const soiViewPanel = document.getElementById("soi-view-panel");
    const soiViewRaw = document.getElementById("soi-view-raw");
    const voiceBtn = document.getElementById("voice");
    let busy = false;
    let lastSoiId = 0;
    const pendingTools = new Map();
    let voiceOn = true;
    try {
      const saved = localStorage.getItem("ainet-voice");
      if (saved === "0") voiceOn = false;
    } catch (e) {}

    const audioQueue = [];
    let audioPlaying = false;
    let audioUnlocked = false;

    function setVoiceUi() {
      voiceBtn.textContent = voiceOn ? "Voice on" : "Voice off";
      voiceBtn.classList.toggle("off", !voiceOn);
      voiceBtn.setAttribute("aria-pressed", voiceOn ? "true" : "false");
    }
    setVoiceUi();
    voiceBtn.addEventListener("click", () => {
      voiceOn = !voiceOn;
      try { localStorage.setItem("ainet-voice", voiceOn ? "1" : "0"); } catch (e) {}
      setVoiceUi();
      if (!voiceOn) {
        audioQueue.length = 0;
        audioPlaying = false;
      }
    });

    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        const a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=");
        a.volume = 0.01;
        const p = a.play();
        if (p && typeof p.then === "function") p.catch(() => {});
        audioUnlocked = true;
      } catch (e) {}
    }

    function enqueueAudio(b64, mime) {
      if (!voiceOn || !b64) return;
      audioQueue.push({ b64, mime: mime || "audio/wav" });
      pumpAudio();
    }

    function pumpAudio() {
      if (audioPlaying || !audioQueue.length) return;
      audioPlaying = true;
      const item = audioQueue.shift();
      const url = "data:" + item.mime + ";base64," + item.b64;
      const audio = new Audio(url);
      const done = () => {
        audioPlaying = false;
        pumpAudio();
      };
      audio.addEventListener("ended", done);
      audio.addEventListener("error", done);
      const p = audio.play();
      if (p && typeof p.then === "function") p.catch(done);
    }

    const SOI_VIEW_KEY = "ainet-soi-view";

    function setSoiView(view) {
      const mode = view === "raw" ? "raw" : "panel";
      soiPanel.classList.toggle("view-panel", mode === "panel");
      soiPanel.classList.toggle("view-raw", mode === "raw");
      soiViewPanel.classList.toggle("on", mode === "panel");
      soiViewRaw.classList.toggle("on", mode === "raw");
      try { localStorage.setItem(SOI_VIEW_KEY, mode); } catch (e) {}
    }
    try { setSoiView(localStorage.getItem(SOI_VIEW_KEY) || "panel"); }
    catch (e) { setSoiView("panel"); }
    soiViewPanel.addEventListener("click", () => setSoiView("panel"));
    soiViewRaw.addEventListener("click", () => setSoiView("raw"));

    function toolClass(name) {
      return "tool-" + String(name || "tool").replace(/[^a-zA-Z0-9_]/g, "_");
    }

    function hintFromRow(row) {
      if (row.hint) return String(row.hint).trim();
      const args = row.arguments;
      if (args && typeof args === "object") {
        for (const key of ["path", "dest", "query", "url", "entry_id", "entry_ids", "title", "slug", "folder_path"]) {
          if (args[key] == null || args[key] === "") continue;
          const val = Array.isArray(args[key]) ? args[key].join(", ") : String(args[key]);
          return key + "=" + val;
        }
      }
      if (row.summary) return String(row.summary);
      if (row.preview) {
        const p = String(row.preview).trim();
        return p.length > 180 ? p.slice(0, 180) + "…" : p;
      }
      return "";
    }

    function parseSoiRow(row) {
      if (row && typeof row === "object" && row.event) return row;
      const text = lineText(row);
      let m = text.match(/^\(SOI tool -> (\S+)(.*)\)$/);
      if (m) return { event: "tool_start", name: m[1], hint: m[2] || "", text };
      m = text.match(/^\(SOI tool (ok|FAIL) (\S+): (.*)\)$/);
      if (m) return { event: "tool_done", ok: m[1] === "ok", name: m[2], summary: m[3], text };
      m = text.match(/^\(SOI wake: phase=(\S+)/);
      if (m) return { event: "idle_wake", phase: m[1], text };
      if (text.startsWith("(SOI filing...")) return { event: "filing_start", text };
      if (text.startsWith("(SOI filing done")) return { event: "filing_done", text };
      if (text.startsWith("(SOI Read refresh...")) return { event: "read_refresh_start", text };
      if (text.startsWith("(SOI Read refresh done")) return { event: "read_refresh_done", text };
      if (text.startsWith("(SOI model ask")) return { event: "model_ask", text };
      if (text.startsWith("(SOI model reply")) return { event: "model_reply", text };
      if (/error|FAIL|failed/i.test(text)) return { event: "error", text, level: "error" };
      return { event: "log", text };
    }

    function phaseCopy(row) {
      const ev = row.event;
      if (ev === "idle_wake") return { title: row.phase === "read_refresh" ? "Read refresh" : "Filing wake", meta: row.text };
      if (ev === "filing_start") return { title: "Filing", meta: row.text };
      if (ev === "filing_done") return { title: "Filing done", meta: row.text };
      if (ev === "filing_skip") return { title: "Filing skipped", meta: row.text };
      if (ev === "read_refresh_start") return { title: "Read refresh", meta: row.text };
      if (ev === "read_refresh_done") return { title: "Read refresh done", meta: row.text };
      if (ev === "read_refresh_skip") return { title: "Read refresh skipped", meta: row.text };
      if (ev === "model_ask") return { title: "Model", meta: row.phase ? "phase " + row.phase : row.text };
      if (ev === "model_reply") return { title: "Model reply", meta: hintFromRow(row) || row.text };
      if (ev === "model_no_tools") return { title: "No tool calls", meta: row.text };
      if (ev === "watcher_start") return { title: "Watcher on", meta: row.text };
      if (ev === "backoff") return { title: "Backoff", meta: row.text };
      return { title: ev || "SOI", meta: row.text || "" };
    }

    function fillDetail(el, arg, result) {
      const body = el.querySelector(".soi-card-body");
      let detail = el.querySelector(".soi-card-detail");
      const hasArg = !!(arg && String(arg).trim());
      const hasResult = !!(result && String(result).trim() && String(result).trim() !== String(arg || "").trim());
      if (!hasArg && !hasResult) {
        if (detail) detail.remove();
        return;
      }
      if (!detail) {
        detail = document.createElement("div");
        detail.className = "soi-card-detail";
        body.appendChild(detail);
      }
      detail.replaceChildren();
      if (hasArg) {
        const a = document.createElement("div");
        a.className = "soi-card-arg";
        a.textContent = String(arg).trim();
        detail.appendChild(a);
      }
      if (hasResult) {
        const b = document.createElement("div");
        b.className = "soi-card-result";
        b.textContent = String(result).trim();
        detail.appendChild(b);
      }
    }

    function appendPhaseCard(row) {
      const copy = phaseCopy(row);
      const el = document.createElement("article");
      el.className = "soi-card phase" + (row.level === "error" || /error/.test(row.event || "") ? " error-ev" : "");
      el.innerHTML =
        '<div class="soi-card-body">' +
          '<span class="soi-phase-label"></span>' +
          '<div class="soi-card-detail"><p class="soi-phase-meta"></p></div>' +
        "</div>";
      el.querySelector(".soi-phase-label").textContent = copy.title;
      const meta = copy.meta.replace(/^\(SOI\s+/i, "").replace(/\)$/, "");
      const metaEl = el.querySelector(".soi-phase-meta");
      if (meta) metaEl.textContent = meta;
      else metaEl.parentElement.remove();
      soiFeed.appendChild(el);
    }

    function appendToolStart(row) {
      const name = row.name || "tool";
      const el = document.createElement("article");
      el.className = "soi-card pending " + toolClass(name);
      el.innerHTML =
        '<div class="soi-card-body">' +
          '<div class="soi-card-top">' +
            '<span class="soi-tool-badge"></span>' +
            '<span class="soi-card-status">running</span>' +
          "</div>" +
        "</div>";
      el.querySelector(".soi-tool-badge").textContent = name;
      const hint = hintFromRow(row);
      el.dataset.arg = hint;
      fillDetail(el, hint, "");
      soiFeed.appendChild(el);
      const stack = pendingTools.get(name) || [];
      stack.push(el);
      pendingTools.set(name, stack);
    }

    function appendToolDone(row) {
      const name = row.name || "tool";
      const stack = pendingTools.get(name) || [];
      let el = stack.pop();
      const ok = row.ok !== false;
      if (!el) {
        appendToolStart({
          name,
          hint: hintFromRow(row),
          arguments: row.arguments,
          summary: row.summary,
        });
        el = (pendingTools.get(name) || []).pop();
      }
      if (!el) return;
      el.classList.remove("pending");
      el.classList.add(ok ? "ok" : "fail");
      const status = el.querySelector(".soi-card-status");
      if (status) status.textContent = ok ? "ok" : "fail";
      fillDetail(el, el.dataset.arg || hintFromRow(row), row.summary || "");
    }

    function appendNoteCard(row, kind) {
      const el = document.createElement("article");
      el.className = "soi-card " + (kind || "note");
      el.innerHTML = '<div class="soi-card-body"><div class="soi-card-detail"><p class="soi-card-hint"></p></div></div>';
      el.querySelector(".soi-card-hint").textContent = row.text || "";
      soiFeed.appendChild(el);
    }

    function appendSoiCard(row) {
      const ev = row.event || "log";
      if (ev === "tool_start") appendToolStart(row);
      else if (ev === "tool_done") appendToolDone(row);
      else if (
        ev === "idle_wake" || ev === "filing_start" || ev === "filing_done" ||
        ev === "filing_skip" || ev === "read_refresh_start" || ev === "read_refresh_done" ||
        ev === "read_refresh_skip" || ev === "model_ask" || ev === "model_reply" ||
        ev === "model_no_tools" || ev === "watcher_start" || ev === "backoff"
      ) appendPhaseCard(row);
      else if (ev === "error" || ev === "model_error" || ev === "filing_error" || ev === "read_refresh_error") {
        appendNoteCard(row, "error-ev");
      } else {
        appendNoteCard(row, "note");
      }
    }

    function asText(v) {
      if (v == null) return "";
      if (typeof v === "string") return v;
      if (typeof v === "number" || typeof v === "boolean") return String(v);
      if (typeof v === "object") {
        if (typeof v.text === "string") return v.text;
        if (typeof v.reply === "string") return v.reply;
        if (typeof v.error === "string") return v.error;
        return "";
      }
      return String(v);
    }

    function addBubble(text, kind) {
      const el = document.createElement("div");
      el.className = "bubble " + kind;
      el.textContent = asText(text);
      if (!el.textContent) return el;
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
      return el;
    }

    function renderMeta(s) {
      const ttsBit = s.tts_enabled
        ? (s.tts_healthy ? "<br>voice ready" : "<br>voice offline")
        : "";
      meta.innerHTML =
        "<strong>" + (s.model || "?") + "</strong><br>" +
        "mode " + (s.mode || "?") +
        (s.session_id ? "<br>session " + s.session_id.slice(0, 8) : "") +
        (s.soi_running ? "<br>SOI running" : "<br>SOI idle") +
        ttsBit;
      if (Array.isArray(s.modes) && modeSel.options.length === 0) {
        for (const m of s.modes) {
          const opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.name || m.id;
          modeSel.appendChild(opt);
        }
      }
      if (s.mode) modeSel.value = s.mode;
      if (Object.prototype.hasOwnProperty.call(s, "soi_running")) {
        setSoiUi(!!s.soi_running);
      }
      appendSoiLines(s.soi_log || []);
    }

    function lineText(row) {
      return asText(row);
    }

    function lineId(row) {
      if (row && typeof row === "object" && row.id != null) return Number(row.id) || 0;
      return 0;
    }

    function appendSoiLines(rows) {
      if (!Array.isArray(rows) || !rows.length) return;
      let added = false;
      for (const row of rows) {
        const id = lineId(row);
        const parsed = parseSoiRow(row);
        const text = parsed.text || lineText(row);
        if (!text && !parsed.event) continue;
        if (id && id <= lastSoiId) continue;
        if (id) lastSoiId = id;
        if (text) soiOut.textContent += (soiOut.textContent ? "\n" : "") + text;
        appendSoiCard(parsed);
        added = true;
      }
      if (added) {
        soiOut.scrollTop = soiOut.scrollHeight;
        soiFeed.scrollTop = soiFeed.scrollHeight;
      }
    }

    function setSoiUi(running) {
      soiBtn.disabled = !!running;
      soiBtn.classList.toggle("running", !!running);
      soiBtn.textContent = running ? "SOI running…" : "Start SOI";
      soiState.classList.toggle("on", !!running);
      soiState.textContent = running ? "Running" : "Idle";
    }

    async function pullSoiLog() {
      try {
        const r = await fetch("/api/soi-log?after=" + lastSoiId);
        const s = await r.json();
        if (s.ok) {
          appendSoiLines(s.lines || []);
          if (Object.prototype.hasOwnProperty.call(s, "soi_running")) {
            setSoiUi(!!s.soi_running);
          }
        }
      } catch (e) {}
    }

    async function refreshStatus() {
      try {
        const r = await fetch("/api/status");
        const s = await r.json();
        if (s.ok) renderMeta(s);
      } catch (e) {
        meta.textContent = "Server offline";
      }
    }

    async function post(path, body) {
      const r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      return r.json();
    }

    async function streamChat(message, voice, botEl) {
      const r = await fetch("/api/chat-stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, voice: !!voice }),
      });
      if (!r.ok || !r.body) {
        throw new Error("chat-stream failed (" + r.status + ")");
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let el = botEl || null;
      let full = "";
      let donePayload = null;
      let err = null;

      const handleEvent = (ev) => {
        if (!ev || typeof ev !== "object") return;
        if (ev.type === "token") {
          const t = asText(ev.text);
          if (!t) return;
          if (!el) el = addBubble("", "bot");
          if (el.classList.contains("sys")) el.classList.remove("sys");
          full += t;
          el.textContent = full;
          logEl.scrollTop = logEl.scrollHeight;
        } else if (ev.type === "audio") {
          enqueueAudio(ev.audio_base64, ev.mime || "audio/wav");
        } else if (ev.type === "tts_error") {
          addBubble("Voice: " + asText(ev.error || "TTS error"), "sys");
        } else if (ev.type === "done") {
          donePayload = ev;
          if (!el) el = addBubble(asText(ev.reply) || "(empty reply)", "bot");
          else if (ev.reply && !full) {
            el.classList.remove("sys");
            el.textContent = asText(ev.reply);
          }
        } else if (ev.type === "error") {
          err = asText(ev.error || "Error");
        }
      };

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const line = raw.split("\n").find((l) => l.startsWith("data:"));
          if (!line) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          try { handleEvent(JSON.parse(payload)); }
          catch (e) {}
        }
      }
      if (err) throw new Error(err);
      return donePayload || { ok: true, reply: full };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      unlockAudio();
      addBubble(text, "user");
      input.value = "";
      const botEl = addBubble("…", "bot sys");
      try {
        const data = await streamChat(text, voiceOn, botEl);
        if (data && data.ok === false) {
          botEl.classList.add("error");
          botEl.textContent = data.error || "Error";
        } else if (data) renderMeta(data);
      } catch (err) {
        botEl.classList.add("error");
        botEl.classList.remove("sys");
        botEl.textContent = String(err);
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
        refreshStatus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      const data = await post("/api/reset", {});
      if (data.ok) {
        addBubble("New OAC session", "sys");
        renderMeta(data);
      }
    });

    soiBtn.addEventListener("click", async () => {
      setSoiUi(true);
      const kick = { event: "idle_wake", phase: "filing", text: "Starting SOI…" };
      soiOut.textContent += (soiOut.textContent ? "\n" : "") + kick.text;
      appendSoiCard(kick);
      soiOut.scrollTop = soiOut.scrollHeight;
      soiFeed.scrollTop = soiFeed.scrollHeight;
      try {
        const data = await post("/api/soi", {});
        if (!data.ok) {
          soiOut.textContent += "\n" + asText(data.error || data.reason || "SOI failed to start");
          setSoiUi(false);
          return;
        }
        if (data.started === false) {
          soiOut.textContent += "\n" + asText(data.reason || "SOI already running");
        }
        appendSoiLines(data.soi_log || data.lines || []);
        setSoiUi(!!(data.soi_running || data.started));
      } catch (err) {
        soiOut.textContent += "\n" + asText(err);
        setSoiUi(false);
      }
    });

    modeSel.addEventListener("change", async () => {
      const data = await post("/api/mode", { mode: modeSel.value });
      if (!data.ok) addBubble(data.error || "Mode change failed", "sys error");
      else {
        addBubble("Mode → " + data.mode, "sys");
        renderMeta(data);
      }
    });

    function connectSoiStream() {
      if (!window.EventSource) {
        setInterval(pullSoiLog, 800);
        return;
      }
      const es = new EventSource("/api/soi-stream?after=0");
      es.onmessage = (ev) => {
        try {
          const s = JSON.parse(ev.data);
          appendSoiLines(s.lines || []);
          if (Object.prototype.hasOwnProperty.call(s, "soi_running")) {
            setSoiUi(!!s.soi_running);
          }
        } catch (err) {}
      };
      es.onerror = () => {
        pullSoiLog();
      };
    }

    refreshStatus();
    pullSoiLog();
    connectSoiStream();
    setInterval(refreshStatus, 8000);
    setInterval(pullSoiLog, 1500);
  </script>
</body>
</html>
